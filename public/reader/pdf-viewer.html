<!doctype html>
<!--
  pdf-viewer.html — W3-8
  Sandboxed pdf.js viewer that loads a document from the parent frame via
  postMessage and forwards selection events back.

  Protocol (inbound from parent):
    { type: 'LOAD_BYTES', bytes: ArrayBuffer }
    { type: 'GOTO', position: string }    // 'prev' | 'next' | page number string
    { type: 'ZOOM', delta: number }
    { type: 'HIGHLIGHT', annotation: ReaderAnnotation }

  Protocol (outbound to parent):
    { type: 'READY' }
    { type: 'POSITION', position: string }   // current page as string
    { type: 'SELECTION', anchor: string, quote: string }
    { type: 'SELECTION_CLEAR' }
    { type: 'ERROR', message: string }

  Dependency: the pinned pdfjs-dist distribution is shipped locally under
  /reader/vendor/. The reader never requests a CDN asset.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer — Scriptor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #111827;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #viewer-root {
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
    }
    canvas {
      box-shadow: 0 4px 24px rgba(0 0 0 / 0.4);
      border-radius: 2px;
      max-width: 100%;
    }
    #status {
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="viewer-root"><p id="status">Waiting for document…</p></div>

  <script type="module">
    const parentOrigin = window.location.origin
    let pdfjsLib
    try {
      pdfjsLib = await import('/reader/vendor/pdf.min.mjs')
    } catch (error) {
      parent.postMessage({ type: 'ERROR', message: `Local PDF renderer failed to load: ${error.message}` }, parentOrigin)
    }

    if (pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/reader/vendor/pdf.worker.min.mjs'
      parent.postMessage({ type: 'READY' }, parentOrigin)
    }

    const root = document.getElementById('viewer-root')
    const status = document.getElementById('status')

    let pdfDoc = null
    let currentPage = 1
    let scale = 1.5

    // ── Renderer ─────────────────────────────────────────────────────────────

    async function renderPage(num) {
      if (!pdfDoc) return
      const page = await pdfDoc.getPage(num)
      const viewport = page.getViewport({ scale })

      let canvas = document.getElementById(`pdf-page-${num}`)
      if (!canvas) {
        canvas = document.createElement('canvas')
        canvas.id = `pdf-page-${num}`
        root.appendChild(canvas)
      }
      canvas.width = viewport.width
      canvas.height = viewport.height
      const ctx = canvas.getContext('2d')
      await page.render({ canvasContext: ctx, viewport }).promise
    }

    async function loadDocument(bytes) {
      status.textContent = 'Loading…'
      try {
        pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise
        root.innerHTML = ''
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          await renderPage(i)
        }
        currentPage = 1
        parent.postMessage({ type: 'POSITION', position: String(currentPage) }, parentOrigin)
        parent.postMessage({ type: 'LOADED' }, parentOrigin)
      } catch (err) {
        parent.postMessage({ type: 'ERROR', message: err.message }, parentOrigin)
      }
    }

    // ── Selection ─────────────────────────────────────────────────────────────

    document.addEventListener('selectionchange', () => {
      const sel = window.getSelection()
      if (!sel || sel.isCollapsed) {
        parent.postMessage({ type: 'SELECTION_CLEAR' }, parentOrigin)
        return
      }
      const quote = sel.toString().trim()
      if (!quote) return
      // Encode selection as `page:offset` anchor (simplified; production should
      // use the text-layer character index from the pdf.js text layer).
      const anchor = JSON.stringify({ page: currentPage, quote: quote.slice(0, 120) })
      parent.postMessage({ type: 'SELECTION', anchor, quote }, parentOrigin)
    })

    // ── Highlight overlay ─────────────────────────────────────────────────────

    function applyHighlight(annotation) {
      // Simplified: production would use the pdf.js text-layer to map the
      // anchor back to canvas coordinates and draw a rect overlay.
      // For now we log so integration tests can verify the postMessage path.
      console.debug('[reader] highlight applied', annotation.id)
    }

    // ── Message handler ───────────────────────────────────────────────────────

    window.addEventListener('message', async (e) => {
      const msg = e.data
      switch (msg?.type) {
        case 'LOAD_BYTES':
          await loadDocument(new Uint8Array(msg.bytes))
          break

        case 'GOTO': {
          if (!pdfDoc) break
          const total = pdfDoc.numPages
          if (msg.position === 'prev') currentPage = Math.max(1, currentPage - 1)
          else if (msg.position === 'next') currentPage = Math.min(total, currentPage + 1)
          else currentPage = Math.max(1, Math.min(total, Number(msg.position) || 1))
          const target = document.getElementById(`pdf-page-${currentPage}`)
          target?.scrollIntoView({ behavior: 'smooth' })
          parent.postMessage({ type: 'POSITION', position: String(currentPage) }, parentOrigin)
          break
        }

        case 'ZOOM':
          scale = Math.max(0.5, Math.min(4, scale + (msg.delta ?? 0)))
          if (pdfDoc) {
            root.innerHTML = ''
            for (let i = 1; i <= pdfDoc.numPages; i++) await renderPage(i)
          }
          break

        case 'HIGHLIGHT':
          applyHighlight(msg.annotation)
          break
      }
    })
  </script>
</body>
</html>
