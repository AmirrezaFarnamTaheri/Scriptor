[package]
name = "scriptor-vault"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
notify-debouncer-mini = "0.4"
zip = "2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
