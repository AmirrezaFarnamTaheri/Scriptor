name: Release Binary Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - VERSION
      - Cargo.toml
      - Cargo.lock
      - package.json
      - scripts/release/**
      - .github/workflows/release*.yml

permissions:
  contents: read

concurrency:
  group: release-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review CLI and daemon release binaries
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable; corepack prepare pnpm@10.33.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source and release contracts
        run: |
          pnpm check:governance
          pnpm check:source
          pnpm check:release-evidence-contracts
          pnpm version:check

      - name: Build release binaries
        run: cargo build --locked --release -p scriptor-cli -p scriptor-daemon --jobs 2

      - name: Create binary review manifest
        shell: pwsh
        run: ./scripts/release/review-binaries.ps1

      - name: Upload review manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-review-binaries-${{ github.run_attempt }}
          path: dist/release-review/binary-review.json
          if-no-files-found: error
