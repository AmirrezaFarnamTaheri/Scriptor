name: Apply UI remediation follow-up

on:
  push:
    branches:
      - fix/visual-review-shell-and-surfaces

permissions:
  contents: write

jobs:
  apply-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/visual-review-shell-and-surfaces
          fetch-depth: 0
      - name: Apply current-head remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}: {old!r}")
              target.write_text(text.replace(old, new, count))

          replace(
              'e2e/capability-surface.spec.ts',
              "    await expect(zenLayout).toHaveAttribute('aria-current', 'true')",
              "    await expect(page.locator('html')).toHaveClass(/scriptor-distraction-free/)\n"
              "    await expect(page.locator('.editor-toolbar')).toHaveCSS('pointer-events', 'none')",
          )

          replace('src/App.tsx', '    setSplitPreview,\n', '')
          replace('src/App.tsx', '    splitPreview,\n', '')
          replace('src/components/InsertMenu.tsx', '        aria-label="Insert content"', '        aria-label="Insert"')

          history = 'src/components/NoteHistoryPanel.tsx'
          replace(
              history,
              "interface CurrentNoteState {\n  path: string\n  markdown: string\n}\n\n/** Formats persisted revision timestamps",
              "interface CurrentNoteState {\n  path: string\n  markdown: string\n}\n\n"
              "interface PreviewErrorState {\n  path: string\n  revisionId: string\n  message: string\n}\n\n"
              "interface CurrentErrorState {\n  path: string\n  message: string\n}\n\n"
              "/** Formats persisted revision timestamps",
          )
          replace(history, '  const [previewError, setPreviewError] = useState<string | null>(null)', '  const [previewError, setPreviewError] = useState<PreviewErrorState | null>(null)')
          replace(history, '  const [currentError, setCurrentError] = useState<string | null>(null)', '  const [currentError, setCurrentError] = useState<CurrentErrorState | null>(null)')
          replace(history, '    setCurrentState(null)\n    setCurrentError(null)\n', '')
          replace(
              history,
              '        setCurrentState({ path: requestedPath, markdown: currentResult.value.markdown })',
              '        setCurrentState({ path: requestedPath, markdown: currentResult.value.markdown })\n        setCurrentError(null)',
          )
          replace(
              history,
              "        setCurrentError(currentResult.reason instanceof Error ? currentResult.reason.message : 'Could not read the current note')",
              "        setCurrentError({\n          path: requestedPath,\n          message: currentResult.reason instanceof Error ? currentResult.reason.message : 'Could not read the current note',\n        })",
          )
          replace(history, '  }, [path])\n\n  useEffect(() => {', '  }, [path])\n\n  const loadedHistoryPath = revisionState?.path ?? null\n\n  useEffect(() => {')
          replace(history, '    if (!path || !selectedId) return', '    if (!path || !selectedId || loadedHistoryPath !== path) return')
          replace(history, '    setPreviewState(null)\n    setPreviewError(null)\n', '')
          replace(
              history,
              '          setPreviewState({ path: requestedPath, revisionId: requestedRevision, markdown })',
              '          setPreviewState({ path: requestedPath, revisionId: requestedRevision, markdown })\n          setPreviewError(null)',
          )
          replace(
              history,
              "          setPreviewError(error instanceof Error ? error.message : 'Could not load this revision')",
              "          setPreviewError({\n            path: requestedPath,\n            revisionId: requestedRevision,\n            message: error instanceof Error ? error.message : 'Could not load this revision',\n          })",
          )
          replace(history, '  }, [path, selectedId])', '  }, [loadedHistoryPath, path, selectedId])')
          replace(history, '  const revisions = revisionState?.path === path ? revisionState.rows : []', '  const revisions = loadedHistoryPath === path ? revisionState?.rows ?? [] : []')
          replace(
              history,
              '  const canRestore = Boolean(selectedId && previewReady && currentReady && !previewError && !currentError)',
              "  const previewErrorMessage =\n    previewError?.path === path && previewError.revisionId === selectedId ? previewError.message : null\n"
              "  const currentErrorMessage = currentError?.path === path ? currentError.message : null\n"
              "  const canRestore = Boolean(\n    selectedId && previewReady && currentReady && !previewErrorMessage && !currentErrorMessage,\n  )",
          )
          replace(history, '            {previewError ? (', '            {previewErrorMessage ? (')
          replace(history, '                Revision preview unavailable: {previewError}. Restore is disabled until the revision can be read.', '                Revision preview unavailable: {previewErrorMessage}. Restore is disabled until the revision can be read.')
          replace(history, '            {currentError ? (', '            {currentErrorMessage ? (')
          replace(history, '                Current note preview unavailable: {currentError}. Restore is disabled until the current note can be compared.', '                Current note preview unavailable: {currentErrorMessage}. Restore is disabled until the current note can be compared.')

          settings = 'src/components/SettingsPanel.tsx'
          replace(
              settings,
              "  useEffect(() => {\n    if (!vaultOpen || !nativeReady) {\n      setConfigReady(false)\n      setConfigLoadError(null)\n      return\n    }\n    let cancelled = false\n    setConfigReady(false)\n    setConfigLoadError(null)\n    setStatus('Loading vault configuration…')\n    void vaultLoadConfig()",
              "  useEffect(() => {\n    if (!vaultOpen || !nativeReady) return\n    let cancelled = false\n    void vaultLoadConfig()",
          )
          replace(settings, '        setConfigReady(true)\n        setStatus(', '        setConfigReady(true)\n        setConfigLoadError(null)\n        setStatus(')

          replace(
              'src/components/StatusDockPanel.tsx',
              '        <div id="dock-panel-problems" role="tabpanel" aria-labelledby="dock-tab-problems">',
              '        <div className="dock-panel diagnostics-dock-panel" id="dock-panel-problems" role="tabpanel" aria-labelledby="dock-tab-problems">',
          )
          replace(
              'src/hooks/useWorkspaceChrome.ts',
              "  // Workspace-mode destinations and infrequent utilities remain available in\n  // the command palette/customizer without competing with writing controls.\n  topBarHiddenActions: ['workbench', 'publish', 'portal', 'graph', 'canvas', 'support', 'paletteStore'],",
              "  // Workspace-mode destinations remain available in the command palette and\n  // customizer without competing with writing controls. Wide layouts keep the\n  // icon-only support/store utilities visible; responsive CSS yields them first.\n  topBarHiddenActions: ['workbench', 'publish', 'portal', 'graph', 'canvas'],",
          )
          replace(
              'src/styles/app/dock-settings.css',
              '.dock-panel header {',
              ".diagnostics-dock-panel .diagnostics-panel {\n  position: static;\n  inset: auto;\n  width: auto;\n  max-height: none;\n  border: 0;\n  border-radius: 0;\n  box-shadow: none;\n  background: transparent;\n}\n\n.dock-panel header {",
          )
          replace('src/styles/app/workspace-geometry-contract.css', '@container (max-width: 620px) {', '@container (max-width: 720px) {')
          PY
          rm .github/workflows/tmp-ui-remediation-followup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): close current-head CI regressions'
          git push origin HEAD:fix/visual-review-shell-and-surfaces
