name: Temporary collaboration Rust formatting evidence

on:
  push:
    branches:
      - feat/collaboration-editor-native-2026-11-15
    paths:
      - '.github/workflows/collaboration-native-format-evidence.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Rust formatter
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - name: Produce formatted source records
        run: |
          cargo +1.96.0 fmt --all
          python3 - <<'PY'
          import json, pathlib, subprocess
          for path in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines():
              if path.endswith('.rs'):
                  text=pathlib.Path(path).read_text()
                  print('SCRIPTOR_FORMAT_RECORD:' + json.dumps({'path':path,'content':text}, ensure_ascii=True))
          print('SCRIPTOR_FORMAT_COMPLETE')
          PY
