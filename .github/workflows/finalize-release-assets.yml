name: Finalize v1.0.8 release assets

on:
  push:
    branches:
      - release/1.0.8-final

permissions:
  contents: write

concurrency:
  group: finalize-v1.0.8-release-assets
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLAYWRIGHT_CHANNEL: msedge
      CI: 'true'
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/1.0.8-final
          fetch-depth: 0

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22 with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Install frozen dependency graph
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Capture final reviewed Windows screenshots
        shell: pwsh
        run: ./scripts/screenshots/capture.ps1 -SkipDesktopBuild -UpdateBaselines

      - name: Synchronize v1.0.8 release version
        shell: pwsh
        run: |
          Set-Content -LiteralPath VERSION -Value '1.0.8' -Encoding utf8
          node scripts/release/version.mjs sync
          cargo update --workspace --offline
          node scripts/release/version.mjs check

      - name: Freeze changelog and screenshot inventory
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const path = require('node:path');

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          if (!/^## 1\.0\.8\b/m.test(changelog)) {
            changelog = changelog.replace(
              /^## Unreleased\r?\n\r?\n/m,
              '## Unreleased\n\n## 1.0.8 - 2026-09-12\n\n',
            );
          }
          fs.writeFileSync(changelogPath, changelog);

          const inventoryPath = 'docs/assets/screenshots/README.md';
          let inventory = fs.readFileSync(inventoryPath, 'utf8');
          inventory = inventory.replace(
            'Screenshots for documentation and marketing. Generated with Playwright in E2E mode.',
            'Screenshots for documentation and marketing. Generated with Playwright in E2E mode.\n\nRelease capture: **v1.0.8**, Windows 2025 / Microsoft Edge, refreshed 2026-09-12 from the frozen release candidate.',
          );
          const lines = inventory.split(/\r?\n/).map((line) => {
            const match = line.match(/^\| ([^|]+\.png) \|([^|]*)\| ([^|]+) \|([^|]*)\|$/);
            if (!match) return line;
            const file = path.join('docs', 'assets', 'screenshots', match[1].trim());
            if (!fs.existsSync(file)) return line;
            const kb = Math.round(fs.statSync(file).size / 1024);
            return `| ${match[1].trim()} |${match[2]}| ${kb} KB |${match[4]}|`;
          });
          fs.writeFileSync(inventoryPath, `${lines.join('\n')}\n`);
          '@ | node
          node scripts/release/verify-changelog.mjs

      - name: Validate finalized candidate
        shell: pwsh
        run: |
          git diff --check
          node scripts/release/version.mjs check
          pnpm check:changelog

      - name: Commit finalized screenshots and release metadata
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .github/workflows/finalize-release-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if (git diff --cached --quiet) {
            throw 'Release finalization produced no changes.'
          }
          git commit -m 'chore(release): finalize v1.0.8 assets and versions'
          git push origin HEAD:release/1.0.8-final
