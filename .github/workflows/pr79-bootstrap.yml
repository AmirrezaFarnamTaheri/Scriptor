name: PR79 patch bootstrap

on:
  push:
    branches:
      - feat/scriptor-improved-v2

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: contains(github.event.head_commit.message, '[pr79-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reassemble and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pr79-bootstrap/chunk-* > /tmp/pr79.patch.b64
          printf '%s  %s\n' '6e4ddfd1e5efbe17e3ddc1cd51cd0ba9d83e49002bf592e843fc2844e2689a89' /tmp/pr79.patch.b64 | sha256sum -c -
          base64 --decode /tmp/pr79.patch.b64 > /tmp/pr79.patch
          printf '%s  %s\n' '50b11965574440dae4fb63eacc55a63cafd6f732f702fe01d22768f4a139792f' /tmp/pr79.patch | sha256sum -c -
          git apply --check /tmp/pr79.patch
          git apply /tmp/pr79.patch

      - name: Commit reviewed seven-file patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            crates/indexer/src/search.rs \
            crates/publish-runner/src/bounded_io.rs \
            crates/publish-runner/src/compile.rs \
            crates/publish-runner/src/lib.rs \
            crates/publish-runner/src/local_site.rs \
            crates/publish-runner/src/plan.rs \
            src/components/PublishDiffView.tsx
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '7'
          git commit -m 'fix: harden publish boundaries and FTS queries [bootstrap-applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
