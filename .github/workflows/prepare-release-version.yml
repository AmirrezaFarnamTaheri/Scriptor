name: Clean Release Preparation

on:
  push:
    branches:
      - fix/release-publishing-and-toolbar-popovers
    paths:
      - .github/workflows/prepare-release-version.yml

permissions:
  contents: write

jobs:
  clean-generated-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-publishing-and-toolbar-popovers

      - name: Remove stale generated section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          stale = '## [0.1.0] - 2026-08-06'
          start = text.find(stale)
          if start >= 0:
              end = text.find('\n## [', start + len(stale))
              if end < 0:
                  raise SystemExit('could not locate the end of the stale changelog section')
              text = text[:start] + text[end + 1:]
          if text.count('## [0.1.1] - 2026-08-06') != 1:
              raise SystemExit('expected exactly one v0.1.1 changelog section')
          path.write_text(text)
          PY

      - name: Commit changelog cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Changelog is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(release): remove stale generated changelog section"
          git push origin HEAD:fix/release-publishing-and-toolbar-popovers
