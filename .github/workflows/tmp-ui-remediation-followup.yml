name: Apply UI remediation follow-up

on:
  push:
    branches:
      - fix/visual-review-shell-and-surfaces

permissions:
  contents: write

jobs:
  apply-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/visual-review-shell-and-surfaces
          fetch-depth: 0
      - name: Apply current-head remediation
        shell: bash
        env:
          PATCH_B64_GZ: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          with open('/tmp/ui-fix.patch', 'wb') as handle:
              handle.write(gzip.decompress(base64.b64decode(os.environ['PATCH_B64_GZ'])))
          PY
          git apply --check /tmp/ui-fix.patch
          git apply /tmp/ui-fix.patch
          rm .github/workflows/tmp-ui-remediation-followup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): close current-head CI regressions'
          git push origin HEAD:fix/visual-review-shell-and-surfaces
