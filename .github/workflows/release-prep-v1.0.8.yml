name: Release prep v1.0.8

on:
  push:
    branches:
      - release/v1.0.8

permissions:
  contents: write

concurrency:
  group: release-prep-v1.0.8
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  PLAYWRIGHT_CHANNEL: msedge
  OLD_VERSION: 1.0.7

jobs:
  prepare:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Checkout release-prep branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22 with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependency graph
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install Playwright FFmpeg runtime
        shell: pwsh
        run: pnpm exec playwright install ffmpeg

      - name: Extract SettingsPanel ownership helpers
        shell: pwsh
        run: |
          @'
          import type { WorkspaceLayout } from '../hooks/useWorkspaceLayout'
          import { LAYOUT_PRESETS, type LayoutPreset } from '../lib/workspace/layoutPresets'
          import type { VaultConfig } from '../types/vault'

          function matchesLayout(a: WorkspaceLayout | undefined, b: WorkspaceLayout): boolean {
            if (!a) return false
            return (
              a.splitPreview === b.splitPreview &&
              a.showStickies === b.showStickies &&
              a.graphDepth === b.graphDepth &&
              a.distractionFree === b.distractionFree
            )
          }

          function isPlainRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === 'object' && value !== null && !Array.isArray(value)
          }

          function valuesEqual(a: unknown, b: unknown): boolean {
            return JSON.stringify(a) === JSON.stringify(b)
          }

          function mergeEditedValue(current: unknown, baseline: unknown, edited: unknown): unknown {
            if (valuesEqual(edited, baseline)) return current
            if (!isPlainRecord(current) || !isPlainRecord(baseline) || !isPlainRecord(edited)) return edited

            const next: Record<string, unknown> = { ...current }
            for (const key of Object.keys(edited)) {
              next[key] = mergeEditedValue(current[key], baseline[key], edited[key])
            }
            return next
          }

          export function mergeEditedVaultConfig(current: VaultConfig, baseline: VaultConfig, edited: VaultConfig): VaultConfig {
            return mergeEditedValue(current, baseline, edited) as VaultConfig
          }

          export function LayoutPresetGallery({
            current,
            onApply,
          }: {
            current: WorkspaceLayout | undefined
            onApply: (preset: LayoutPreset) => void
          }) {
            return (
              <div className="settings-layout-presets">
                <h4 className="settings-subheading">Layout templates</h4>
                <p className="health-subtitle">
                  Apply a template to reconfigure this mode&apos;s split preview, stickies, and graph depth in one click.
                </p>
                <ul className="layout-preset-list">
                  {LAYOUT_PRESETS.map((preset) => {
                    const active = matchesLayout(current, preset.layout)
                    return (
                      <li key={preset.id} className="layout-preset-item">
                        <div className="layout-preset-copy">
                          <strong>{preset.name}</strong>
                          <span className="health-subtitle">{preset.description}</span>
                        </div>
                        <button
                          type="button"
                          className="toolbar-button"
                          aria-label={`Apply ${preset.name} layout template`}
                          aria-pressed={active}
                          onClick={() => onApply(preset)}
                        >
                          {active ? 'Active' : 'Apply'}
                        </button>
                      </li>
                    )
                  })}
                </ul>
              </div>
            )
          }
          '@ | Set-Content -LiteralPath src/components/SettingsPanelHelpers.tsx -Encoding utf8

          @'
          const fs = require('fs')
          const file = 'src/components/SettingsPanel.tsx'
          let source = fs.readFileSync(file, 'utf8')
          const oldImport = "import { LAYOUT_PRESETS, type LayoutPreset } from '../lib/workspace/layoutPresets'\n"
          const newImport = "import { LayoutPresetGallery, mergeEditedVaultConfig } from './SettingsPanelHelpers'\n"
          if (!source.includes(oldImport)) throw new Error('SettingsPanel layout preset import anchor missing')
          source = source.replace(oldImport, newImport)
          const start = source.indexOf('function matchesLayout(')
          const end = source.indexOf('interface SettingsPanelProps')
          if (start < 0 || end < 0 || end <= start) throw new Error('SettingsPanel helper extraction anchors missing')
          source = source.slice(0, start) + source.slice(end)
          fs.writeFileSync(file, source)
          '@ | node

          $lineCount = (Get-Content src/components/SettingsPanel.tsx).Count
          Write-Host "SettingsPanel.tsx lines after extraction: $lineCount"
          if ($lineCount -gt 650) { throw "SettingsPanel.tsx still exceeds ownership ratchet: $lineCount" }

      - name: Regenerate reviewed Windows screenshots
        shell: pwsh
        run: pwsh -NoProfile -File scripts/screenshots/capture.ps1 -SkipDesktopBuild -UpdateBaselines

      - name: Synchronize v1.0.8 release surfaces
        shell: pwsh
        run: |
          Set-Content -LiteralPath VERSION -Value "1.0.8" -NoNewline
          Add-Content -LiteralPath VERSION -Value ""
          node scripts/release/version.mjs sync
          @'
          const fs = require('fs')
          const path = require('path')
          const oldVersion = process.env.OLD_VERSION
          const nextVersion = '1.0.8'

          const lockPath = 'Cargo.lock'
          let lock = fs.readFileSync(lockPath, 'utf8')
          lock = lock.split('[[package]]').map((block, index) => {
            if (index === 0) return block
            if (/\nname = "scriptor-[^"]+"/.test(block)) {
              block = block.replace(new RegExp(`\\nversion = "${oldVersion.replace(/\./g, '\\.')}"`), `\nversion = "${nextVersion}"`)
            }
            return block
          }).join('[[package]]')
          fs.writeFileSync(lockPath, lock)

          const changelogPath = 'CHANGELOG.md'
          let changelog = fs.readFileSync(changelogPath, 'utf8')
          if (!new RegExp(`^## ${nextVersion.replace(/\./g, '\\.')}\\b`, 'm').test(changelog)) {
            changelog = changelog.replace(/^## Unreleased\s*$/m, `## Unreleased\n\n## ${nextVersion}`)
          }
          fs.writeFileSync(changelogPath, changelog)

          const readmePath = 'README.md'
          let readme = fs.readFileSync(readmePath, 'utf8')
          readme = readme
            .replace(`version-${oldVersion}-`, `version-${nextVersion}-`)
            .replace(`current version is **${oldVersion}**`, `current version is **${nextVersion}**`)
            .replace(`**Active development.** v${oldVersion} is the current early production candidate.`, `**Active development.** v${nextVersion} is the current production release.`)
          fs.writeFileSync(readmePath, readme)

          const catalogPath = path.join('docs', 'assets', 'screenshots', 'README.md')
          let catalog = fs.readFileSync(catalogPath, 'utf8')
          for (const file of fs.readdirSync(path.join('docs', 'assets', 'screenshots'))) {
            if (!file.endsWith('.png')) continue
            const kb = Math.round(fs.statSync(path.join('docs', 'assets', 'screenshots', file)).size / 1024)
            const escaped = file.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            catalog = catalog.replace(new RegExp(`(^\\| ${escaped} \\| .*? \\| )\\d+ KB( \\|.*$)`, 'm'), `$1${kb} KB$2`)
          }
          fs.writeFileSync(catalogPath, catalog)
          '@ | node

      - name: Validate release prep
        shell: pwsh
        run: |
          node scripts/release/version.mjs check
          node scripts/release/verify-changelog.mjs
          pnpm check:governance
          pnpm lint

      - name: Commit prepared release candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-prep-v1.0.8.yml
          git add -A
          git status --short
          git commit -m "chore(release): prepare v1.0.8"
          git push origin HEAD:release/v1.0.8
