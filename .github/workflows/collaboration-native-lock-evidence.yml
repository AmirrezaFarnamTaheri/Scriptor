name: Collaboration native dependency lock evidence

on:
  push:
    branches:
      - feat/collaboration-editor-native-2026-11-15
    paths:
      - 'apps/desktop/src-tauri/Cargo.toml'
      - '.github/workflows/collaboration-native-lock-evidence.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate focused Cargo dependency resolution
        run: cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Expose resolved lock in bounded text evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          print('SCRIPTOR_NATIVE_LOCK_BEGIN')
          for line in Path('Cargo.lock').read_text().splitlines():
              print('SCRIPTOR_NATIVE_LOCK_LINE:' + line)
          print('SCRIPTOR_NATIVE_LOCK_END')
          PY
