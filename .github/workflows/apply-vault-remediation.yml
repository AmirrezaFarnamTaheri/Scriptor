name: Apply vault remediation

on:
  push:
    branches: [claude/repo-audit-optimization-f7m4hi]

permissions:
  contents: write

concurrency:
  group: apply-vault-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d59622b24fc2e660c36a0d9f1f4d1f5f9fef57
        with:
          ref: claude/repo-audit-optimization-f7m4hi
          fetch-depth: 0
      - name: Fetch verified patch blob
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: __PATCH_BLOB_SHA__
          PATCH_GZIP_SHA256: 03dea8361e6bd72e7e4dbb76faf1cdecfbce9f4fd5c89a3cc3bc247d02d36cfd
          PATCH_SHA256: 3656237b9af31b2e918b9afdc0f4130d84a6147bde0d4ef54116c305ab28268b
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/remediation.patch.gz
          echo "${PATCH_GZIP_SHA256}  /tmp/remediation.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/remediation.patch.gz > /tmp/remediation.patch
          echo "${PATCH_SHA256}  /tmp/remediation.patch" | sha256sum --check --strict
          git apply --check /tmp/remediation.patch
          git apply /tmp/remediation.patch
      - name: Commit product changes and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm --force .github/workflows/apply-vault-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: establish vault identity and mutation safety'
          git push origin HEAD:claude/repo-audit-optimization-f7m4hi
