name: Apply complete repository hardening

on:
  push:
    branches:
      - automation/apply-complete-hardening-2026-08-05

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/automation/apply-complete-hardening-2026-08-05'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diagnose staged payload
        shell: bash
        run: |
          set -euo pipefail
          for part in .automation/scriptor-hardening.patch.gz.b64.part*; do
            normalized="$RUNNER_TEMP/$(basename "$part").normalized"
            tr -d '\r\n' < "$part" > "$normalized"
            echo "$(basename "$part") bytes=$(wc -c < "$normalized") sha256=$(sha256sum "$normalized" | cut -d' ' -f1)"
          done
          cat .automation/scriptor-hardening.patch.gz.b64.part* | tr -d '\r\n' > "$RUNNER_TEMP/hardening.patch.gz.b64"
          echo "canonical-bytes=$(wc -c < "$RUNNER_TEMP/hardening.patch.gz.b64")"
          sha256sum "$RUNNER_TEMP/hardening.patch.gz.b64"
          exit 1
