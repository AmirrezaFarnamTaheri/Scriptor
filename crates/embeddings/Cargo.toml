[package]
name = "scriptor-embeddings"
version = "1.0.7"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
scriptor-export-runner = { path = "../export-runner" }
scriptor-vault = { path = "../vault" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "blocking"] }

[dev-dependencies]
tempfile = "3"
