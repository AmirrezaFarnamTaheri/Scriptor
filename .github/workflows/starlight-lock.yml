name: Starlight lock template

on:
  pull_request:
    paths:
      - 'crates/publish-runner/src/local_site.rs'
      - 'crates/publish-runner/src/starlight-lock/**'
      - 'scripts/validation/starlight-lock-template.mjs'
      - '.github/workflows/starlight-lock.yml'
  push:
    branches: [main, master]
    paths:
      - 'crates/publish-runner/src/local_site.rs'
      - 'crates/publish-runner/src/starlight-lock/**'
      - 'scripts/validation/starlight-lock-template.mjs'
      - '.github/workflows/starlight-lock.yml'

permissions:
  contents: read

concurrency:
  group: starlight-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify generated Starlight lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned pnpm 10.33.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Validate canonical scaffold lock
        shell: bash
        run: |
          set -euo pipefail
          lock_dir="${RUNNER_TEMP}/scriptor-starlight-lock"
          rm -rf "${lock_dir}"
          mkdir -p "${lock_dir}"
          cat > "${lock_dir}/package.json" <<'JSON'
          {
            "name": "scriptor-publish",
            "private": true,
            "type": "module",
            "packageManager": "pnpm@10.33.0",
            "scripts": {
              "dev": "astro dev",
              "build": "astro build",
              "preview": "astro preview"
            },
            "dependencies": {
              "@astrojs/starlight": "0.41.7",
              "astro": "7.2.1"
            }
          }
          JSON
          node scripts/validation/starlight-lock-template.mjs --write "${lock_dir}/pnpm-lock.yaml"
          pnpm --dir "${lock_dir}" install --lockfile-only --frozen-lockfile --ignore-scripts
          echo "STARLIGHT_LOCK=${lock_dir}/pnpm-lock.yaml" >> "${GITHUB_ENV}"

      - name: Verify checked-in lock template
        shell: bash
        run: node scripts/validation/starlight-lock-template.mjs "${STARLIGHT_LOCK}"

      - name: Upload validated lock for diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starlight-pnpm-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.STARLIGHT_LOCK }}
          if-no-files-found: error
          retention-days: 1
