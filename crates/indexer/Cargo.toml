[package]
name = "scriptor-indexer"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
scriptor-vault = { path = "../vault" }
scriptor-export-runner = { path = "../export-runner" }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.25", features = ["bundled"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
