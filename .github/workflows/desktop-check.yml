name: Desktop compile

on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ci/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ci/**"
      - ".github/workflows/desktop-check.yml"

permissions:
  contents: read

concurrency:
  group: desktop-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    name: Desktop crate compile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI_LOG_DIR: artifacts/ci-logs/desktop-${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Describe desktop compile scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})"

      - name: Install Linux desktop system dependencies
        if: matrix.platform == 'linux'
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install Linux desktop system dependencies" -FilePath "bash" -ArgumentList @("-lc", "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf") -TimeoutSeconds 900

      - name: Compile desktop crate, tests, examples, and build scripts
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Compile desktop crate tests examples and build scripts" -FilePath "cargo" -ArgumentList @("check", "-p", "scriptor-desktop", "--all-targets", "--locked") -TimeoutSeconds 2400 -HeartbeatSeconds 20

      - name: Capture desktop compile failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})"

      - name: Finalize desktop compile evidence
        if: always()
        shell: pwsh
        run: ./scripts/ci/finalize-job.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})" -Status "${{ job.status }}"

      - name: Upload desktop compile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-desktop-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7

  finalize-dependencies:
    name: Finalize consolidated dependency wave
    if: github.event_name == 'pull_request' && github.event.action == 'reopened' && github.event.pull_request.number == 45
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integrate/open-prs-v0.1.1
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure pinned pnpm 10.33.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure pinned Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Apply dependency manifests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packagePath = 'package.json'
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          Object.assign(packageJson.dependencies, { 'lucide-react': '^1.28.0' })
          Object.assign(packageJson.devDependencies, {
            '@playwright/test': '^1.62.1',
            '@types/react': '^19.2.18',
            '@types/react-dom': '^19.2.4',
            '@vitejs/plugin-react': '^6.0.5',
            globals: '^17.9.0',
            vite: '^8.2.0',
          })
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)

          function replaceRequired(path, before, after) {
            const source = fs.readFileSync(path, 'utf8')
            if (source.includes(after)) return
            if (!source.includes(before)) throw new Error(`Expected text was not found in ${path}: ${before}`)
            fs.writeFileSync(path, source.split(before).join(after))
          }
          replaceRequired('apps/desktop/src-tauri/Cargo.toml', 'reqwest = { version = "0.12", features = ["json"] }', 'reqwest = { version = "0.13", features = ["json"] }')
          replaceRequired('crates/canvas-engine/Cargo.toml', 'resvg = "0.47"', 'resvg = "0.48"')
          replaceRequired('crates/vault/Cargo.toml', 'zip = "2"', 'zip = "8"')
          replaceRequired('.github/workflows/release.yml', 'actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0', 'actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1')
          NODE

      - name: Regenerate dependency lockfiles
        shell: bash
        run: |
          pnpm install --lockfile-only
          cargo metadata --format-version 1 > cargo-metadata.json

      - name: Verify dependency resolution
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const expected = {
            dependencies: { 'lucide-react': '^1.28.0' },
            devDependencies: {
              '@playwright/test': '^1.62.1',
              '@types/react': '^19.2.18',
              '@types/react-dom': '^19.2.4',
              '@vitejs/plugin-react': '^6.0.5',
              globals: '^17.9.0',
              vite: '^8.2.0',
            },
          }
          for (const [section, values] of Object.entries(expected)) {
            for (const [name, version] of Object.entries(values)) {
              if (packageJson[section]?.[name] !== version) throw new Error(`${section}.${name} must be ${version}`)
            }
          }
          const metadata = JSON.parse(fs.readFileSync('cargo-metadata.json', 'utf8'))
          const resolved = new Set(metadata.packages.map((pkg) => `${pkg.name}@${pkg.version}`))
          for (const target of ['reqwest@0.13.4', 'resvg@0.48.1', 'zip@8.6.0']) {
            if (!resolved.has(target)) throw new Error(`Cargo resolution is missing ${target}`)
          }
          NODE
          grep -F 'actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1' .github/workflows/release.yml
          git diff --check

      - name: Commit dependency wave
        shell: bash
        run: |
          rm -f cargo-metadata.json
          rm -f .github/workflows/apply-consolidated-dependencies.yml
          rm -f .github/workflows/integrate-dependencies.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'chore(deps): consolidate open dependency updates'
          git push origin HEAD:integrate/open-prs-v0.1.1
