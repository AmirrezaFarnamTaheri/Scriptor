name: One-time rustfmt repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: rustfmt-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0
          rustfmt --version

      - name: Format Rust workspace and push repair
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all
          $changes = git status --porcelain -- '*.rs'
          if (-not $changes) {
            Write-Host "Rust workspace is already formatted."
            exit 0
          }
          Write-Host $changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: format Rust workspace"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
