name: Agent apply comprehensive remediation

on:
  push:
    branches:
      - agent/comprehensive-product-remediation
    paths:
      - '.agent-remediation/**'
      - '.github/workflows/agent-apply-remediation.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reassemble and verify audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-remediation/part-*.b64 | base64 --decode | gunzip > /tmp/remediation.patch
          echo "49bc61db6f88da8acff831997b2ba8f4a741e60bfbc38d6bd2e9a830d382ccbe  /tmp/remediation.patch" | sha256sum --check
          git apply --check /tmp/remediation.patch

      - name: Apply remediation patch and commit
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/remediation.patch
          rm -rf .agent-remediation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply comprehensive product remediation"
          git push origin HEAD:agent/comprehensive-product-remediation
