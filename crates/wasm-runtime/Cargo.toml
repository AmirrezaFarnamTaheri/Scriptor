[package]
name = "scriptor-wasm-runtime"
version = "1.0.7"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
wasmtime = { version = "48", optional = true, default-features = false, features = ["runtime", "cranelift"] }
wat = { version = "1", optional = true }

[features]
default = []
# The real executor is opt-in: wasmtime pulls a large dependency tree and
# the product ships the stub until the signed plugin marketplace exists.
wasmtime-backend = ["dep:wasmtime", "dep:wat"]
