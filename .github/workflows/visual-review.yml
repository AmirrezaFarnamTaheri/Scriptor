name: Visual review

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt-repair:
    name: One-time Rustfmt repair
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0
          rustfmt --version

      - name: Apply exact workspace rustfmt output
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }

          $changes = git status --porcelain -- apps/desktop/src-tauri/src crates
          if (-not $changes) {
            throw "Expected Rust formatting changes were not generated."
          }
          Write-Host $changes

          if ("${{ github.event.pull_request.head.repo.full_name }}" -ne "${{ github.repository }}") {
            throw "Refusing to push Rust formatting for a forked pull request."
          }

          git config user.name "github-actions[bot]"
          if ($LASTEXITCODE -ne 0) { throw "git config user.name failed" }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { throw "git config user.email failed" }
          git add -- apps/desktop/src-tauri/src crates
          if ($LASTEXITCODE -ne 0) { throw "git add failed" }
          git commit -m "style(rust): apply workspace rustfmt"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }
