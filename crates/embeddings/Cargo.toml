[package]
name = "scriptor-embeddings"
version = "0.1.1"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "blocking"] }

[dev-dependencies]
tempfile = "3"
