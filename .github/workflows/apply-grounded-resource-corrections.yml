name: Apply grounded resource corrections

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-grounded-resource-corrections-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/unified-agentstack-sync-final'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout clean feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/unified-agentstack-sync-final
          fetch-depth: 0

      - name: Materialize decoded corrections
        run: node scripts/apply-resource-sync-grounding.mjs

      - name: Commit grounded implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(desktop): ground resource target contracts"
          git push origin HEAD:feat/unified-agentstack-sync-final
