[package]
name = "scriptor-native-git"
version = "0.1.1"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
diffy = "0.4"
# W2-9 (W1-3): write .conflicted.md sidecar via vault atomic write primitives.
vault = { path = "../vault", package = "scriptor-vault" }

[dev-dependencies]
tempfile = "3"
