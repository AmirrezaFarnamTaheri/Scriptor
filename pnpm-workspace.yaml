# Dependency pins. Moved here from the package.json "pnpm" field, which pnpm 10.x
# no longer reads (it warns "The 'pnpm' field in package.json is no longer read").
# See https://pnpm.io/settings
overrides:
  # GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr, and GHSA-c6gr-qvv4-5v3f
  # are fixed in 3.4.17; enforce it for Monaco and other transitive copies.
  dompurify: ">=3.4.17 <4"
  # GHSA-6gmq-8vp8-gcm6 (XML External Entity / doctype handling) affects
  # @xmldom/xmldom >=0.9.0 <=0.9.11. epubjs still pins ^0.9.8 upstream, so the
  # override is the stopgap until it moves its own range past the patch release.
  "@xmldom/xmldom": ">=0.9.12 <0.10"
  # GHSA-f23m-r3pf-42rh & GHSA-r5fr-rjxr-66jc affect lodash-es <=4.17.23.
  # chevrotain (pulled by mermaid 12) pins 4.17.23, so override to patched >=4.18.1.
  lodash-es: ">=4.18.1"
  # GHSA-238p-pmpm-9mq7: align vulnerable Mermaid/rehype transitive copies with
  # the already-locked direct renderer dependency; retain its integrity hash.
  "katex@<0.18.2": "0.18.7"
  # A single Lezer NodeProp implementation is required for CodeMirror
  # Markdown/highlighting (lang-markdown previously used 1.5.2 while
  # the parser and highlighter used 1.5.3).
  "@lezer/common": "1.5.3"

packages:
  - "apps/*"
  - "packages/*"
  - "packages/plugins/*"

allowBuilds:
  chromedriver: true
