name: Validate integration head

on:
  push:
    branches:
      - integrate/open-prs-v0.1.1
    paths:
      - .github/workflows/validate-integration-head.yml

permissions:
  contents: read

concurrency:
  group: validate-integration-head
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  FORCE_COLOR: 1

jobs:
  validate-linux:
    name: Full Linux validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Configure pinned pnpm 10.33.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure pinned Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Install frozen frontend graph
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify immutable lockfiles
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          pnpm install --frozen-lockfile --offline
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml

      - name: Validate governance and source contracts
        shell: bash
        run: |
          pnpm check:governance
          pnpm check:source
          pnpm check:contracts
          pnpm check:mcp
          pnpm check:plugins
          pnpm check:canvas
          pnpm check:editor
          pnpm check:renderer
          pnpm check:export
          pnpm check:portal
          pnpm check:knowledge
          pnpm check:merge
          pnpm check:citations
          pnpm check:headless

      - name: Lint and build frontend
        shell: bash
        run: |
          pnpm lint
          pnpm build

      - name: Validate Rust formatting, lint, compile, and tests
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --exclude scriptor-desktop

      - name: Validate release contracts
        shell: pwsh
        run: |
          pnpm check:release-signing
          pnpm check:release-hardening
          pnpm release:smoke
          pnpm release:perf-gate

      - name: Install Chromium for Playwright
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Run functional browser suite
        shell: bash
        run: pnpm test:e2e

      - name: Run visual browser suite
        shell: bash
        run: pnpm test:visual

      - name: Supply-chain audit
        shell: bash
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check
          pnpm audit --prod

  desktop-matrix:
    name: Desktop compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Configure pinned Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Compile desktop targets with locked graph
        shell: bash
        run: cargo check --locked -p scriptor-desktop --all-targets
