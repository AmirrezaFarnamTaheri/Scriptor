name: Documentation localization

on:
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/**/*.md'
      - 'scripts/validation/docs-localization-contracts.mjs'
      - '.github/workflows/docs-localization.yml'
  push:
    branches:
      - main
    paths:
      - 'README*.md'
      - 'docs/**/*.md'
      - 'scripts/validation/docs-localization-contracts.mjs'
      - '.github/workflows/docs-localization.yml'

permissions:
  contents: read

jobs:
  localization-contract:
    name: Locale and RTL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Validate localized documentation
        run: node scripts/validation/docs-localization-contracts.mjs
