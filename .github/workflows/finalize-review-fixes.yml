name: Finalize verified review fixes

on:
  push:
    branches:
      - integrate/open-prs-v0.1.1

permissions:
  contents: write

concurrency:
  group: finalize-review-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current integration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integrate/open-prs-v0.1.1
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Configure pinned pnpm 10.33.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure pinned Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Apply fail-closed reviewed patches
        shell: bash
        run: node scripts/validation/finalize-review-fixes.mjs

      - name: Install frozen frontend graph
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Format and validate patched sources
        shell: bash
        run: |
          cargo fmt --all
          pnpm lint
          pnpm check:contracts
          pnpm check:source
          node --test scripts/release/signing-policy.test.mjs
          cargo test -p scriptor-desktop commands::resources --locked
          cargo check -p scriptor-desktop --all-targets --locked

      - name: Commit only after validation
        shell: bash
        run: |
          rm scripts/validation/finalize-review-fixes.mjs
          rm .github/workflows/finalize-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/ResourceSyncPanel.tsx \
            apps/desktop/src-tauri/src/commands/resources/mod.rs \
            apps/desktop/src-tauri/src/commands/resources/discovery.rs \
            apps/desktop/src-tauri/src/commands/resources/fs_ops.rs \
            scripts/validation/finalize-review-fixes.mjs \
            .github/workflows/finalize-review-fixes.yml
          git diff --cached --check
          git commit -m "fix(resource-sync): address blocking review findings"
          git push origin HEAD:integrate/open-prs-v0.1.1
