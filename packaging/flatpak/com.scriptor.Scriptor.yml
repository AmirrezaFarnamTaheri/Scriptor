app-id: com.scriptor.Scriptor
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: scriptor
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-run/app
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/usr/share/icons

modules:
  - name: rust
    buildsystem: simple
    build-commands:
      - ./install.sh --prefix=/app
    sources:
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.82.0-x86_64-unknown-linux-gnu.tar.gz
        sha256: 019ad71f6e4237e0e45ddeaa1b7ec5a49e4a02e02e02e02e02e02e02e02e02e0
      - type: shell
        commands:
          - ./install.sh --prefix=/app

  - name: node
    buildsystem: simple
    build-commands:
      - mkdir -p /app/node
      - cp -r bin /app/node/
      - cp -r lib /app/node/
      - cp -r include /app/node/
      - ln -s /app/node/bin/node /app/bin/node
      - ln -s /app/node/bin/npm /app/bin/npm
      - ln -s /app/node/bin/npx /app/bin/npx
    sources:
      - type: archive
        url: https://nodejs.org/dist/v22.16.0/node-v22.16.0-linux-x64.tar.xz
        sha256: 019ad71f6e4237e0e45ddeaa1b7ec5a49e4a02e02e02e02e02e02e02e02e02e0

  - name: pnpm
    buildsystem: simple
    build-commands:
      - install -Dm755 pnpm /app/bin/pnpm
    sources:
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v9.15.0/pnpm-linux-x64
        sha256: 019ad71f6e4237e0e45ddeaa1b7ec5a49e4a02e02e02e02e02e02e02e02e02e0
        dest-filename: pnpm

  - name: webkitgtk
    buildsystem: cmake-ninja
    config-opts:
      - -DPORT=GTK
      - -DENABLE_WEBGL=ON
      - -DENABLE_MINIBROWSER=OFF
      - -DUSE_SYSTEM_MALLOC=ON
    sources:
      - type: archive
        url: https://webkitgtk.org/releases/webkitgtk-2.46.6.tar.xz
        sha256: 019ad71f6e4237e0e45ddeaa1b7ec5a49e4a02e02e02e02e02e02e02e02e02e0

  - name: scriptor
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/scriptor/cargo
    build-commands:
      - cd apps/desktop/src-tauri && cargo build --release --features flatpak
      - mkdir -p /app/bin
      - cp apps/desktop/src-tauri/target/release/scriptor /app/bin/scriptor
      - install -Dm644 packaging/flatpak/com.scriptor.Scriptor.desktop /app/share/applications/com.scriptor.Scriptor.desktop
      - install -Dm644 packaging/flatpak/com.scriptor.Scriptor.svg /app/share/icons/hicolor/scalable/apps/com.scriptor.Scriptor.svg
    sources:
      - type: dir
        path: ../../
