name: Performance Trends

# Nightly/weekly performance trend gates at vault sizes that the mandatory
# PR gate (1k) does not cover. These are trend signals, not release blockers:
# failures open an investigation rather than blocking merges.

on:
  schedule:
    - cron: "0 3 * * *" # nightly 5k trend
    - cron: "0 4 * * 6" # weekly 25k deep run (Saturday)
  pull_request:
    paths:
      - '.github/workflows/perf-trends.yml'
      - 'scripts/benchmarks/bench-large.ps1'
      - 'scripts/fixture-import/generate-synthetic-vault.ps1'
  workflow_dispatch:
    inputs:
      size:
        description: "Fixture size"
        default: "5k"
        type: choice
        options:
          - "1k"
          - "5k"
          - "25k"

permissions:
  contents: read

concurrency:
  group: perf-trends-${{ github.event.schedule || github.event.inputs.size || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PERF_SCHEDULE: ${{ github.event.schedule || '' }}
  REQUESTED_SIZE: ${{ inputs.size || '5k' }}

defaults:
  run:
    working-directory: .

jobs:
  bench:
    name: Vault benchmark (${{ github.event_name == 'pull_request' && '5k PR smoke' || (github.event.schedule == '0 4 * * 6' && '25k weekly' || (github.event.inputs.size || '5k nightly')) }})
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup default 1.96.0
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true

      - name: Prepare and validate synthetic vault fixture
        shell: pwsh
        run: |
          $size = if ($env:GITHUB_EVENT_NAME -eq 'schedule' -and $env:PERF_SCHEDULE -eq '0 4 * * 6') { '25k' } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_SIZE } else { '5k' }
          $expected = @{ '1k' = 1000; '5k' = 5000; '25k' = 25000 }[$size]
          if (-not $expected) { throw "Unsupported performance fixture size: $size" }
          $vault = "packages/test-fixtures/vaults/synthetic-$size"
          if (-not (Test-Path -LiteralPath $vault -PathType Container)) {
            pwsh -NoProfile -File scripts/fixture-import/generate-synthetic-vault.ps1 -Output $vault -Count $expected
            if ($LASTEXITCODE -ne 0) { throw "Synthetic fixture generation failed ($LASTEXITCODE): $vault" }
          }
          $notes = Join-Path $vault 'notes'
          if (-not (Test-Path -LiteralPath $notes -PathType Container)) { throw "Fixture notes directory is missing: $notes" }
          $actual = @(Get-ChildItem -LiteralPath $notes -File -Filter 'note-*.md').Count
          if ($actual -ne $expected) { throw "Fixture note count mismatch ($actual, expected $expected): $vault" }
          Write-Host "Validated synthetic-$size fixture ($actual notes)"

      - name: Run benchmark producers and persist evidence
        shell: pwsh
        run: |
          $size = if ($env:GITHUB_EVENT_NAME -eq 'schedule' -and $env:PERF_SCHEDULE -eq '0 4 * * 6') { '25k' } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_SIZE } else { '5k' }
          if ($size -notin @('1k', '5k', '25k')) { throw "Unsupported performance fixture size: $size" }
          New-Item -ItemType Directory -Force -Path artifacts/performance | Out-Null
          pwsh -NoProfile -File scripts/benchmarks/bench-large.ps1 -Size $size -Mode scan -Iterations 3 -OutputPath "artifacts/performance/benchmark-report-$size-scan.json"
          pwsh -NoProfile -File scripts/benchmarks/bench-large.ps1 -Size $size -Mode search -Iterations 3 -OutputPath "artifacts/performance/benchmark-report-$size-search.json"
          if (-not (Test-Path "artifacts/performance/benchmark-report-$size-scan.json") -or -not (Test-Path "artifacts/performance/benchmark-report-$size-search.json")) {
            throw 'benchmark evidence is incomplete'
          }

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-trend-report
          path: |
            perf-baselines.json
            artifacts/performance/benchmark-report*.json
          if-no-files-found: error
          retention-days: 30
