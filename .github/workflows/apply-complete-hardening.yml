name: Apply complete repository hardening

on:
  push:
    branches:
      - automation/apply-complete-hardening-2026-08-05
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-complete-repository-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/automation/apply-complete-hardening-2026-08-05' || github.head_ref == 'automation/apply-complete-hardening-2026-08-05'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Assemble staged payload
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/part-checks" <<'CHECKS'
          2d2a2dce28a2bc2ec4bdd8aafcd7a6311e9cd9038229f2257baddc392790e131  .automation/scriptor-hardening.patch.gz.b64.part00
          6c04e0ac4d7c81cc422887c9424dc6383d88fa7e85d0936c661102385048db3f  .automation/scriptor-hardening.patch.gz.b64.part01
          fd826bfe2b23ca844de3997b215ee5010dfff67c258410558eaae62c929dfe87  .automation/scriptor-hardening.patch.gz.b64.part02
          cbac6b0a2357a6d7e7ef09bf6e286e2f86d815f0cd3c4face7be004aaabd51aa  .automation/scriptor-hardening.patch.gz.b64.part03
          fb210989accc94dfd761ec7eae154227a5aaf1c758f05f8ef91c72c0a612028d  .automation/scriptor-hardening.patch.gz.b64.part04
          368856497e898f83c65c008400f2469e654435182056e0562cba4c526b178624  .automation/scriptor-hardening.patch.gz.b64.part05
          CHECKS
          sha256sum -c "$RUNNER_TEMP/part-checks"
          cat .automation/scriptor-hardening.patch.gz.b64.part* > "$RUNNER_TEMP/hardening.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/hardening.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/hardening.patch"
          echo "e79963ecc5040926c0b445e387699123f20b8447a4540f136a3c9cd39873e917  $RUNNER_TEMP/hardening.patch" | sha256sum -c -

      - name: Apply, validate, and publish one atomic commit
        shell: bash
        env:
          EXPECTED_BASE: 045213834832d684abe9b88f8e634f89a9e7a20a
          TARGET_BRANCH: audit/complete-repository-hardening-2026-08-05
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"

          git apply --check "$RUNNER_TEMP/hardening.patch"
          git apply "$RUNNER_TEMP/hardening.patch"

          node scripts/release/version.mjs check
          node scripts/validation/action-pins.mjs
          node scripts/validation/deep-module-boundaries.mjs
          node scripts/validation/i18n-parity.mjs
          node scripts/validation/docs-contracts.mjs
          node scripts/validation/source-contracts.mjs
          node scripts/validation/rust-source-contracts.mjs
          node scripts/validation/authorization-inventory.mjs
          node scripts/validation/frontend-quality.mjs
          node scripts/validation/css-custom-properties.mjs
          node scripts/validation/module-size-ratchet.mjs
          node scripts/validation/rustsec-exceptions.mjs
          node --test \
            scripts/benchmarks/benchmark-utils.test.mjs \
            scripts/release/source-identity.test.mjs \
            scripts/release/release-evidence-utils.test.mjs \
            scripts/release/sbom-utils.test.mjs \
            scripts/release/signing-policy.test.mjs \
            scripts/validation/rustsec-exceptions.test.mjs \
            scripts/validation/release-hardening-contracts.test.mjs
          git diff --check

          git add -A
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): complete repository hardening'
          git push origin "HEAD:$TARGET_BRANCH"
