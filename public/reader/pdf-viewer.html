<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer — Scriptor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111827; color: #e2e8f0; font-family: system-ui, sans-serif; overflow: hidden; }
    #viewer-root { height: 100%; overflow: auto; display: grid; place-items: start center; padding: 1rem; }
    #page-shell { position: relative; box-shadow: 0 4px 24px rgba(0 0 0 / 0.4); background: white; }
    #page-canvas { display: block; max-width: 100%; height: auto; }
    #text-layer, #highlight-layer { position: absolute; inset: 0; overflow: hidden; }
    #text-layer { z-index: 3; user-select: text; }
    #text-layer span { position: absolute; color: transparent; white-space: pre; transform-origin: 0 0; cursor: text; line-height: 1; }
    #highlight-layer { z-index: 2; pointer-events: none; }
    .reader-highlight { position: absolute; border-radius: 2px; opacity: .34; mix-blend-mode: multiply; }
    #status { color: #94a3b8; font-size: .85rem; padding: 2rem; }
  </style>
</head>
<body>
  <div id="viewer-root"><p id="status">Waiting for document…</p></div>
  <script type="module">
    const MAX_PAGE_PIXELS = 16_000_000
    const MAX_PAGES = 5_000
    const MAX_ANNOTATIONS = 5_000
    const params = new URLSearchParams(location.search)
    const configuredParentOrigin = params.get('parentOrigin')
    let parentOrigin = null
    try { parentOrigin = configuredParentOrigin ? new URL(configuredParentOrigin).origin : null } catch { parentOrigin = null }

    const root = document.getElementById('viewer-root')
    const status = document.getElementById('status')
    let pdfjsLib = null
    let pdfDoc = null
    let loadingTask = null
    let renderTask = null
    let renderGeneration = 0
    let currentPage = 1
    let scale = 1.5
    let textLayer = null
    let highlightLayer = null
    let pageText = ''
    let textNodes = []
    const annotations = new Map()

    function post(message) {
      if (parentOrigin) parent.postMessage(message, parentOrigin)
    }

    function fail(message) {
      status.textContent = message
      post({ type: 'ERROR', message })
    }

    try {
      pdfjsLib = await import('./vendor/pdf.min.mjs')
      pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs'
    } catch (error) {
      fail(`Local PDF renderer failed to load: ${error instanceof Error ? error.message : String(error)}`)
    }

    if (!parentOrigin) {
      fail('Reader parent origin is missing or invalid')
    } else if (pdfjsLib) {
      post({ type: 'READY' })
    }

    async function loadDocument(bytes) {
      status.textContent = 'Loading…'
      try {
        renderGeneration += 1
        renderTask?.cancel()
        renderTask = null
        if (loadingTask) await loadingTask.destroy().catch(() => {})
        if (pdfDoc) await pdfDoc.destroy().catch(() => {})
        loadingTask = pdfjsLib.getDocument({ data: bytes, isEvalSupported: false })
        pdfDoc = await loadingTask.promise
        if (pdfDoc.numPages > MAX_PAGES) throw new Error(`PDF has ${pdfDoc.numPages} pages; Reader limit is ${MAX_PAGES}`)
        currentPage = 1
        await renderCurrentPage()
        post({ type: 'LOADED' })
      } catch (error) {
        fail(error instanceof Error ? error.message : String(error))
      }
    }

    async function renderCurrentPage() {
      if (!pdfDoc) return
      const generation = ++renderGeneration
      renderTask?.cancel()
      const page = await pdfDoc.getPage(currentPage)
      if (generation !== renderGeneration) return

      const requested = page.getViewport({ scale })
      const pixels = requested.width * requested.height
      const effectiveScale = pixels > MAX_PAGE_PIXELS
        ? scale * Math.sqrt(MAX_PAGE_PIXELS / pixels)
        : scale
      const viewport = page.getViewport({ scale: effectiveScale })

      root.replaceChildren()
      const shell = document.createElement('div')
      shell.id = 'page-shell'
      shell.style.width = `${viewport.width}px`
      shell.style.height = `${viewport.height}px`

      const canvas = document.createElement('canvas')
      canvas.id = 'page-canvas'
      canvas.width = Math.ceil(viewport.width)
      canvas.height = Math.ceil(viewport.height)
      canvas.style.width = `${viewport.width}px`
      canvas.style.height = `${viewport.height}px`

      highlightLayer = document.createElement('div')
      highlightLayer.id = 'highlight-layer'
      textLayer = document.createElement('div')
      textLayer.id = 'text-layer'
      shell.append(canvas, highlightLayer, textLayer)
      root.appendChild(shell)

      const context = canvas.getContext('2d', { alpha: false })
      if (!context) throw new Error('PDF canvas context is unavailable')
      renderTask = page.render({ canvasContext: context, viewport })
      try {
        await renderTask.promise
      } catch (error) {
        if (generation !== renderGeneration || error?.name === 'RenderingCancelledException') return
        throw error
      } finally {
        if (generation === renderGeneration) renderTask = null
      }
      if (generation !== renderGeneration) return

      await renderTextLayer(page, viewport)
      replayHighlights()
      post({ type: 'POSITION', position: String(currentPage) })
    }

    async function goTo(position) {
      if (!pdfDoc) return
      if (position === 'prev') currentPage = Math.max(1, currentPage - 1)
      else if (position === 'next') currentPage = Math.min(pdfDoc.numPages, currentPage + 1)
      else currentPage = Math.max(1, Math.min(pdfDoc.numPages, Number(position) || 1))
      await renderCurrentPage()
    }

    async function zoomBy(delta) {
      scale = Math.max(.5, Math.min(4, scale + (Number(delta) || 0)))
      if (pdfDoc) await renderCurrentPage()
    }

    async function renderTextLayer(page, viewport) {
      const content = await page.getTextContent()
      if (!textLayer) return
      textLayer.replaceChildren()
      pageText = ''
      textNodes = []

      for (const item of content.items) {
        if (!('str' in item) || !item.str) continue
        const transform = pdfjsLib.Util.transform(viewport.transform, item.transform)
        const fontHeight = Math.max(1, Math.hypot(transform[2], transform[3]))
        const span = document.createElement('span')
        const start = pageText.length
        span.textContent = item.str
        span.style.left = `${transform[4]}px`
        span.style.top = `${transform[5] - fontHeight}px`
        span.style.fontSize = `${fontHeight}px`
        if (item.width) span.style.width = `${Math.max(1, item.width * viewport.scale)}px`
        textLayer.appendChild(span)
        const node = span.firstChild
        if (node) textNodes.push({ node, start, end: start + item.str.length })
        pageText += item.str
      }
    }

    function selectionOffsets(range) {
      if (!textLayer || !textLayer.contains(range.commonAncestorContainer)) return null
      try {
        const beforeStart = document.createRange()
        beforeStart.selectNodeContents(textLayer)
        beforeStart.setEnd(range.startContainer, range.startOffset)
        const beforeEnd = document.createRange()
        beforeEnd.selectNodeContents(textLayer)
        beforeEnd.setEnd(range.endContainer, range.endOffset)
        return { start: beforeStart.toString().length, end: beforeEnd.toString().length }
      } catch {
        return null
      }
    }

    document.addEventListener('selectionchange', () => {
      const selection = window.getSelection()
      if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
        post({ type: 'SELECTION_CLEAR' })
        return
      }
      const quote = selection.toString().trim()
      if (!quote) return
      const offsets = selectionOffsets(selection.getRangeAt(0))
      if (!offsets) return
      post({
        type: 'SELECTION',
        anchor: JSON.stringify({ version: 1, page: currentPage, start: offsets.start, end: offsets.end, quote }),
        quote,
      })
    })

    function rangeForOffsets(start, end) {
      const startEntry = textNodeForOffset(start, false)
      const endEntry = textNodeForOffset(end, true)
      if (!startEntry || !endEntry) return null
      const range = document.createRange()
      range.setStart(startEntry.node, Math.max(0, Math.min(start - startEntry.start, startEntry.node.textContent.length)))
      range.setEnd(endEntry.node, Math.max(0, Math.min(end - endEntry.start, endEntry.node.textContent.length)))
      return range
    }

    function textNodeForOffset(offset, preferLaterBoundary) {
      let low = 0
      let high = textNodes.length
      while (low < high) {
        const mid = (low + high) >> 1
        if (textNodes[mid].start <= offset) low = mid + 1
        else high = mid
      }
      let index = Math.max(0, low - 1)
      if (preferLaterBoundary && index + 1 < textNodes.length && textNodes[index + 1].start === offset) {
        index += 1
      } else if (!preferLaterBoundary && index > 0 && textNodes[index - 1].end === offset) {
        index -= 1
      }
      const entry = textNodes[index]
      return entry && offset >= entry.start && offset <= entry.end ? entry : null
    }

    function anchorFor(annotation) {
      try {
        const parsed = JSON.parse(annotation.anchor)
        if (parsed?.page !== currentPage) return null
        let start = Number(parsed.start)
        let end = Number(parsed.end)
        if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end <= start || end > pageText.length) {
          const quote = String(parsed.quote || annotation.quote || '')
          start = quote ? pageText.indexOf(quote) : -1
          end = start >= 0 ? start + quote.length : -1
        }
        return start >= 0 && end > start ? { start, end } : null
      } catch {
        const quote = String(annotation.quote || '')
        const start = quote ? pageText.indexOf(quote) : -1
        return start >= 0 ? { start, end: start + quote.length } : null
      }
    }

    function replayHighlights() {
      if (!highlightLayer || !textLayer) return
      highlightLayer.replaceChildren()
      const shellRect = textLayer.getBoundingClientRect()
      for (const annotation of annotations.values()) {
        const anchor = anchorFor(annotation)
        if (!anchor) continue
        const range = rangeForOffsets(anchor.start, anchor.end)
        if (!range) continue
        for (const rect of range.getClientRects()) {
          const marker = document.createElement('div')
          marker.className = 'reader-highlight'
          marker.style.left = `${rect.left - shellRect.left}px`
          marker.style.top = `${rect.top - shellRect.top}px`
          marker.style.width = `${rect.width}px`
          marker.style.height = `${rect.height}px`
          marker.style.background = annotation.color || '#facc15'
          highlightLayer.appendChild(marker)
        }
      }
    }

    function rememberHighlight(annotation) {
      if (!annotation || typeof annotation.id !== 'string') return
      if (!annotations.has(annotation.id) && annotations.size >= MAX_ANNOTATIONS) return
      annotations.set(annotation.id, annotation)
      replayHighlights()
    }

    function handleReaderKeydown(event) {
      if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) return
      const target = event.target
      const tagName = target?.tagName
      if (tagName === 'INPUT' || tagName === 'TEXTAREA' || target?.isContentEditable) return
      if (event.key === 'ArrowLeft') {
        event.preventDefault()
        void goTo('prev')
      } else if (event.key === 'ArrowRight') {
        event.preventDefault()
        void goTo('next')
      } else if (event.key === '+' || event.key === '=') {
        event.preventDefault()
        void zoomBy(.25)
      } else if (event.key === '-') {
        event.preventDefault()
        void zoomBy(-.25)
      }
    }

    document.addEventListener('keydown', handleReaderKeydown)

    window.addEventListener('message', async (event) => {
      if (event.source !== parent || event.origin !== parentOrigin) return
      const msg = event.data
      if (!msg || typeof msg !== 'object' || typeof msg.type !== 'string') return
      switch (msg.type) {
        case 'LOAD_BYTES':
          if (!(msg.bytes instanceof ArrayBuffer)) return
          await loadDocument(new Uint8Array(msg.bytes))
          break
        case 'GOTO':
          await goTo(msg.position)
          break
        case 'ZOOM':
          await zoomBy(msg.delta)
          break
        case 'HIGHLIGHT':
          rememberHighlight(msg.annotation)
          break
        case 'HIGHLIGHTS':
          annotations.clear()
          if (Array.isArray(msg.annotations)) {
            for (const annotation of msg.annotations.slice(0, MAX_ANNOTATIONS)) rememberHighlight(annotation)
          }
          replayHighlights()
          break
      }
    })
  </script>
</body>
</html>
