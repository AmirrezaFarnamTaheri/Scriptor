name: Finalize supply-chain dependency fixes

on:
  push:
    branches:
      - integrate/open-prs-v0.1.1
    paths:
      - .github/workflows/finalize-supply-chain-fix.yml

permissions:
  contents: write

concurrency:
  group: finalize-supply-chain-fix
  cancel-in-progress: false

jobs:
  finalize:
    name: Regenerate lockfiles and verify audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: integrate/open-prs-v0.1.1

      - name: Configure pinned pnpm 10.33.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure pinned Rust 1.96.0
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Apply dependency policy fixes
        shell: python
        run: |
          import json
          from pathlib import Path

          for raw_path in ("packages/export/package.json", "packages/renderer/package.json"):
              path = Path(raw_path)
              payload = json.loads(path.read_text())
              payload["dependencies"]["mermaid"] = "^11.16.1"
              path.write_text(json.dumps(payload, indent=2) + "\n")

          cargo_toml = Path("crates/vault/Cargo.toml")
          content = cargo_toml.read_text()
          old = 'zip = "8"'
          new = 'zip = { version = "8", default-features = false, features = ["deflate"] }'
          if old not in content:
              raise SystemExit("expected zip dependency declaration not found")
          cargo_toml.write_text(content.replace(old, new, 1))

      - name: Regenerate targeted lockfile entries
        shell: bash
        run: |
          pnpm --filter @scriptor/export --filter @scriptor/renderer update mermaid@11.16.1 --lockfile-only
          cargo update -p zip --precise 8.6.0
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Verify supply-chain policy
        shell: bash
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check
          pnpm audit --prod

      - name: Commit verified dependency graph
        shell: bash
        run: |
          git rm .github/workflows/finalize-supply-chain-fix.yml
          git add packages/export/package.json packages/renderer/package.json crates/vault/Cargo.toml pnpm-lock.yaml Cargo.lock
          unexpected="$(git diff --cached --name-only | grep -Ev '^(\.github/workflows/finalize-supply-chain-fix\.yml|packages/export/package\.json|packages/renderer/package\.json|crates/vault/Cargo\.toml|pnpm-lock\.yaml|Cargo\.lock)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): clear supply-chain policy failures"
          git push origin HEAD:integrate/open-prs-v0.1.1
