name: PR112 CI recovery

on:
  push:
    branches: [fix/visual-review-shell-and-surfaces]
    paths:
      - .github/workflows/pr112-ci-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/visual-review-shell-and-surfaces
          fetch-depth: 0

      - name: Apply remaining state-authority and test-contract recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              source = p.read_text()
              if old not in source:
                  raise SystemExit(f"missing expected source in {path}: {old[:120]!r}")
              p.write_text(source.replace(old, new, count))

          app = Path('src/App.tsx')
          source = app.read_text()
          start = source.find('  const setEditorSurfaceMode = useCallback(')
          if start < 0:
              raise SystemExit('editor-surface callback start missing')
          end = source.find('  const deleteActiveNote = useCallback(', start)
          if end < 0:
              raise SystemExit('editor-surface callback end marker missing')
          source = source[:start] + source[end:]

          mcp_marker = '  const mcp = useMcpRuntime('
          mcp_at = source.find(mcp_marker)
          if mcp_at < 0:
              raise SystemExit('MCP runtime marker missing')
          new_surface = (
              "  const setEditorSurfaceMode = useCallback(\n"
              "    (mode: 'source' | 'split' | 'rendered') => {\n"
              "      patchChrome({ editorSurfaceMode: mode })\n"
              "      setActiveMode(mode === 'rendered' ? 'preview' : 'inspector')\n"
              "    },\n"
              "    [patchChrome, setActiveMode],\n"
              "  )\n\n"
              "  const splitPreviewActive = chrome.editorSurfaceMode === 'split'\n\n"
          )
          source = source[:mcp_at] + new_surface + source[mcp_at:]
          source = source.replace(
              "currentLayout: { splitPreview, showStickies: stickiesVisible, graphDepth, distractionFree }",
              "currentLayout: { splitPreview: splitPreviewActive, showStickies: stickiesVisible, graphDepth, distractionFree }",
              1,
          )
          source = source.replace('    setSplitPreview,\n    setStickiesVisible,\n', '    setEditorSurfaceMode,\n    setStickiesVisible,\n', 1)
          source = source.replace(
              "  const showSplitPreview =\n    (chrome.editorSurfaceMode === 'split' || splitPreview) && Boolean(workspace.activePath)\n",
              "  const showSplitPreview = splitPreviewActive && Boolean(workspace.activePath)\n",
              1,
          )
          source = source.replace('        splitPreview,\n        showStickies: stickiesVisible,', '        splitPreview: splitPreviewActive,\n        showStickies: stickiesVisible,', 1)
          if source.count('setSplitPreview(nextLayout.splitPreview)') != 2:
              raise SystemExit('workspace layout split setter count changed')
          source = source.replace('setSplitPreview(nextLayout.splitPreview)', "setEditorSurfaceMode(nextLayout.splitPreview ? 'split' : 'source')", 2)
          source = source.replace('      setPublishCenterOpen,\n      setSplitPreview,\n      setStickiesVisible,', '      setPublishCenterOpen,\n      setEditorSurfaceMode,\n      setStickiesVisible,', 1)
          source = source.replace('      setGraphDepth,\n      setSplitPreview,\n      setStickiesVisible,\n      workspaceMode,', '      setGraphDepth,\n      setEditorSurfaceMode,\n      setStickiesVisible,\n      workspaceMode,', 1)
          source = source.replace('      setWorkspaceMode,\n      splitPreview,\n      stickiesVisible,', '      setWorkspaceMode,\n      splitPreviewActive,\n      stickiesVisible,', 1)
          source = source.replace('        graphFullVault,\n        splitPreview,\n        setSplitPreview,\n        setStatusDockTab,', '        graphFullVault,\n        splitPreview: splitPreviewActive,\n        setStatusDockTab,', 1)
          source = source.replace('      setSettingsOpen,\n      setSplitPreview,\n      setStatusDockTab,', '      setSettingsOpen,\n      setStatusDockTab,', 1)
          source = source.replace('      setTasksOpen,\n      splitPreview,\n      workspace,', '      setTasksOpen,\n      splitPreviewActive,\n      workspace,', 1)
          source = source.replace('          splitPreview={splitPreview}\n          setSplitPreview={setSplitPreview}\n          showSplitPreview={showSplitPreview}', '          showSplitPreview={showSplitPreview}', 1)
          source = source.replace('          splitPreview={splitPreview}\n          activePath={workspace.activePath}', '          splitPreview={splitPreviewActive}\n          activePath={workspace.activePath}', 1)
          source = source.replace(
              '        <AppTopBar\n        onPatchChrome={patchChrome}\n          vault={workspace.vault}',
              '        <AppTopBar\n          chrome={chrome}\n          onPatchChrome={patchChrome}\n          vault={workspace.vault}',
              1,
          )
          app.write_text(source)

          replace('src/hooks/useStoreSurfaceController.ts', '  setSplitPreview: (updater: (current: boolean) => boolean) => void', "  setEditorSurfaceMode: (mode: 'source' | 'split') => void")
          replace('src/hooks/useStoreSurfaceController.ts', '    setSplitPreview, setStickiesVisible, setGraphDepth, setDistractionFree,', '    setEditorSurfaceMode, setStickiesVisible, setGraphDepth, setDistractionFree,')
          replace('src/hooks/useStoreSurfaceController.ts', '      setSplitPreview(() => preset.layout.splitPreview)', "      setEditorSurfaceMode(preset.layout.splitPreview ? 'split' : 'source')")
          replace('src/hooks/useStoreSurfaceController.ts', '[applyLayout, setDistractionFree, setGraphDepth, setSplitPreview, setStickiesVisible, workspaceMode]', '[applyLayout, setDistractionFree, setEditorSurfaceMode, setGraphDepth, setStickiesVisible, workspaceMode]')

          replace('src/lib/buildPaletteCommands.ts', '  setSplitPreview: (updater: (value: boolean) => boolean) => void\n', '')
          replace('src/lib/buildPaletteCommands.ts', '    setSplitPreview,\n', '')
          replace('src/lib/buildPaletteCommands.ts', 'run: () => setSplitPreview((value) => !value)', "run: () => setEditorSurfaceMode?.(splitPreview ? 'source' : 'split')")
          replace('src/lib/buildPaletteCommands.test.ts', '    setSplitPreview: () => {},\n', '')
          replace('src/components/shell/EditorWorkspace.tsx', '  splitPreview: boolean\n  setSplitPreview: (updater: (value: boolean) => boolean) => void\n', '')
          replace('src/components/PublishCenter.tsx', 'ariaLabel="Export and publish"', 'ariaLabel="Export & publish"')

          for path in ['e2e/screenshots.spec.ts', 'e2e/visual-review.spec.ts']:
              p = Path(path)
              text = p.read_text()
              if "name: 'Note Health'" not in text:
                  raise SystemExit(f'{path}: stale Note Health selector missing')
              p.write_text(text.replace("name: 'Note Health'", "name: 'Vault health'"))

          p = Path('e2e/workspace.spec.ts')
          text = p.read_text()
          text = text.replace("name: 'Export and publish'", "name: 'Export & publish'")
          text = text.replace("await expect(historyPanel.locator('.note-history-markdown')).toContainText('Previous revision')", "await expect(historyPanel.locator('.note-history-revision-markdown')).toContainText('Previous revision')")
          p.write_text(text)
          replace('e2e/visual-coverage-matrix.spec.ts', '/Export and publish|Publish center/', '/Export & publish|Publish center/')

          p = Path('e2e/frontend-polish-regressions.spec.ts')
          text = p.read_text()
          pattern = re.compile(r"  test\('Jobs reveals its panel after the dock chrome is hidden'.*?\n  \}\)\n\n", re.S)
          replacement = (
              "  test('status summary reveals its selected panel after the dock chrome is hidden', async ({ page }) => {\n"
              "    await launchApp(page)\n"
              "    const summary = page.locator('.jobs-button')\n"
              "    await summary.click()\n"
              "    const selectedTab = page.locator('.bottom-tabs [role=\"tab\"][aria-selected=\"true\"]')\n"
              "    await expect(selectedTab).toBeVisible()\n"
              "    const panelId = await selectedTab.getAttribute('aria-controls')\n"
              "    expect(panelId).toBeTruthy()\n"
              "    await expect(page.locator(`#${panelId}`)).toBeVisible()\n"
              "    await page.getByRole('button', { name: 'Hide status dock tabs', exact: true }).click()\n"
              "    await expect(page.locator(`#${panelId}`)).toHaveCount(0)\n"
              "    await summary.click()\n"
              "    await expect(page.locator(`#${panelId}`)).toBeVisible()\n"
              "  })\n\n"
          )
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('status-summary regression block missing')
          old_output = "const outputTab = page.getByRole('tab', { name: 'Output' })"
          if old_output not in text:
              raise SystemExit('broad output-tab locator missing')
          text = text.replace(old_output, "const outputTab = page.locator('.bottom-tabs').getByRole('tab', { name: 'Output', exact: true })", 1)
          p.write_text(text)
          PY

          rm .github/workflows/pr112-ci-recovery.yml
          git diff --check

      - name: Commit recovered implementation
        shell: bash
        run: |
          git config user.name "Farnam"
          git config user.email "taheri.farnam@gmail.com"
          git add -A
          git commit -m "fix(ui): unify editor view state and repair stale E2E contracts"
          git push origin HEAD:fix/visual-review-shell-and-surfaces
