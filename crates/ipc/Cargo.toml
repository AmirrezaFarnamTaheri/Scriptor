[package]
name = "scriptor-ipc"
version = "1.0.3"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
