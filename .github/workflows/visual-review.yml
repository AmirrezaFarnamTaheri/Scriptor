name: Visual review

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

env:
  FORCE_COLOR: 1

jobs:
  visual-review:
    name: Windows visual regression
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI_LOG_DIR: artifacts/ci-logs/visual-review
      PLAYWRIGHT_CHANNEL: msedge
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22 with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Describe visual review scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Visual regression review"

      - name: Install frozen pnpm dependency graph
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install frozen pnpm dependency graph" -FilePath "pnpm" -ArgumentList @("install", "--frozen-lockfile") -TimeoutSeconds 900

      - name: Install Playwright FFmpeg runtime
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install Playwright FFmpeg runtime" -FilePath "pnpm" -ArgumentList @("exec", "playwright", "install", "ffmpeg") -TimeoutSeconds 900

      - name: Run visual regression suite and refresh changed baselines
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Run visual regression suite" -FilePath "pnpm" -ArgumentList @("exec", "playwright", "test", "--config", "playwright.visual.config.ts", "--update-snapshots=changed") -TimeoutSeconds 1800 -HeartbeatSeconds 20

      - name: Commit refreshed baselines and Rust CI repair
        shell: pwsh
        run: |
          if ("${{ github.event.pull_request.head.repo.full_name }}" -ne "${{ github.repository }}") {
            throw "Refusing to push visual baselines for a forked pull request."
          }

          $transportTests = "crates/daemon/src/transport/tests.rs"
          $source = [System.IO.File]::ReadAllText($transportTests)
          $needle = "use std::sync::Mutex;`n"
          $replacement = "use std::sync::Mutex;`nuse std::sync::atomic::{AtomicUsize, Ordering};`n"
          if (-not $source.Contains($needle)) {
            throw "Expected daemon transport test import was not found."
          }
          $source = $source.Replace($needle, $replacement)
          [System.IO.File]::WriteAllText($transportTests, $source, [System.Text.UTF8Encoding]::new($false))

          $paths = @(
            "crates/daemon/src/transport/tests.rs",
            "e2e/visual-review.spec.ts-snapshots",
            "e2e/screenshots.spec.ts-snapshots"
          )
          $changes = git status --porcelain -- $paths
          if (-not $changes) {
            throw "Expected CI repair changes were not generated."
          }
          Write-Host $changes

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $paths
          git commit -m "fix(ci): repair Rust tests and refresh visual baselines"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Capture visual review failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Visual regression review"

      - name: Finalize visual review evidence
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "Visual regression review" -Status $env:JOB_STATUS

      - name: Upload visual reports and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review-${{ github.run_attempt }}
          path: |
            ${{ env.CI_LOG_DIR }}
            playwright-report/visual
            test-results/visual
            e2e/visual-review.spec.ts-snapshots
            e2e/screenshots.spec.ts-snapshots
          if-no-files-found: warn
          retention-days: 14
