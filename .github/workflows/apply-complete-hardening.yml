name: Apply complete repository hardening

on:
  push:
    branches:
      - automation/apply-complete-hardening-2026-08-05

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/automation/apply-complete-hardening-2026-08-05'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract deletion window
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < .automation/scriptor-hardening.patch.gz.b64.part03 > "$RUNNER_TEMP/part03"
          printf 'REMOTE_WINDOW='
          dd if="$RUNNER_TEMP/part03" bs=1 skip=5500 count=900 status=none
          printf '\n'
          exit 1
