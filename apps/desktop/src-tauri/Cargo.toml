[package]
name = "scriptor-desktop"
version = "1.0.1"
description = "Scriptor desktop shell"
authors = ["Scriptor"]
edition = "2024"
license.workspace = true

[lib]
name = "scriptor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scriptor-export-runner = { path = "../../../crates/export-runner" }
scriptor-canvas-engine = { path = "../../../crates/canvas-engine" }
scriptor-daemon = { path = "../../../crates/daemon" }
scriptor-ipc = { path = "../../../crates/ipc" }
scriptor-system-bridge = { path = "../../../crates/system-bridge" }
scriptor-indexer = { path = "../../../crates/indexer" }
scriptor-native-git = { path = "../../../crates/native-git" }
scriptor-publish-runner = { path = "../../../crates/publish-runner" }
scriptor-vault = { path = "../../../crates/vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
arboard = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", features = ["json", "blocking", "form", "query"] }
tracing = "0.1"
sha2 = "0.11"
hex = "0.4"

[package.metadata.tauri]
# Root package metadata for the desktop app.

[dev-dependencies]
tempfile = "3"
