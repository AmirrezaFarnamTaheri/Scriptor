name: Apply complete repository hardening

on:
  push:
    branches:
      - automation/apply-complete-hardening-2026-08-05

permissions:
  contents: write

concurrency:
  group: apply-complete-repository-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/automation/apply-complete-hardening-2026-08-05'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Construct validated release-order commit object
        shell: bash
        env:
          EXPECTED_PARENT: 5314f4f30dcc824eda66620c20aba853ea2d0b42
          TARGET_BRANCH: audit/complete-repository-hardening-2026-08-05
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"

          git apply --check "$GITHUB_WORKSPACE/.automation/windows-manifest-order.patch"
          git apply "$GITHUB_WORKSPACE/.automation/windows-manifest-order.patch"

          node scripts/validation/action-pins.mjs
          node scripts/validation/source-contracts.mjs
          env -u GITHUB_SHA -u SCRIPTOR_SOURCE_COMMIT node --test scripts/validation/release-hardening-contracts.test.mjs
          git diff --check

          git add .github/workflows/release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): hash Windows installers after signing'
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse HEAD^{tree})"

          # Expected to be rejected by the workflow-scoped token after the object is uploaded.
          git push origin "HEAD:$TARGET_BRANCH"
