[package]
name = "scriptor-daemon"
version = "1.0.1"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "scriptor-daemon"
path = "src/main.rs"

[dependencies]
scriptor-export-runner = { path = "../export-runner" }
scriptor-ipc = { path = "../ipc" }
scriptor-indexer = { path = "../indexer" }
scriptor-system-bridge = { path = "../system-bridge" }
scriptor-native-git = { path = "../native-git" }
scriptor-vault = { path = "../vault" }
scriptor-canvas-engine = { path = "../canvas-engine" }
ammonia = "4"
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
interprocess = "2"
subtle = "2"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = "0.13"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
