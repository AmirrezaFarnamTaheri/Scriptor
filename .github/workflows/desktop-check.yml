name: Desktop compile

on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ci/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ci/**"
      - ".github/workflows/desktop-check.yml"

permissions:
  contents: read

concurrency:
  group: desktop-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    name: Desktop crate compile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI_LOG_DIR: artifacts/ci-logs/desktop-${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Describe desktop compile scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})"

      - name: Install Linux desktop system dependencies
        if: matrix.platform == 'linux'
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install Linux desktop system dependencies" -FilePath "bash" -ArgumentList @("-lc", "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf") -TimeoutSeconds 900

      - name: Compile desktop crate, tests, examples, and build scripts
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Compile desktop crate tests examples and build scripts" -FilePath "cargo" -ArgumentList @("check", "-p", "scriptor-desktop", "--all-targets", "--locked") -TimeoutSeconds 2400 -HeartbeatSeconds 20

      - name: Capture desktop compile failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})"

      - name: Finalize desktop compile evidence
        if: always()
        shell: pwsh
        run: ./scripts/ci/finalize-job.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})" -Status "${{ job.status }}"

      - name: Upload desktop compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-desktop-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7
