[package]
name = "scriptor-extractor"
version = "1.0.7"
edition = "2024"
license.workspace = true
description = "Heading/section extraction from Markdown — shared by reader, mind-map, and outline (W3-9)"

[lib]
path = "src/lib.rs"

[dependencies]
# Markdown parsing — pulldown-cmark is already used by scriptor-indexer
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Error handling
thiserror = "2"

# Serialisation (HeadingNode → JSON for TS bridge)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
