# cargo-deny configuration for Scriptor (cargo-deny 0.14+ / v2 schema)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Warn about unmaintained advisories for all crates in the graph.
unmaintained = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    # Scriptor itself is AGPL-3.0-or-later.
    "AGPL-3.0-or-later",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
