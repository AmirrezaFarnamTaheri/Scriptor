name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package exact source tree
        shell: bash
        run: git archive --format=zip --output=scriptor-source.zip HEAD
      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: scriptor-source-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: scriptor-source.zip
          if-no-files-found: error
          retention-days: 1

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh compatible Cargo dependencies
        run: cargo update

      - name: Upload refreshed Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check cargo-deny
        id: cargo-deny
        continue-on-error: true
        shell: bash
        run: cargo deny check > cargo-deny-check.log 2>&1

      - name: Upload cargo-deny report
        if: steps.cargo-deny.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-report
          path: cargo-deny-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce cargo-deny result
        if: steps.cargo-deny.outcome == 'failure'
        shell: bash
        run: |
          tail -n 80 cargo-deny-check.log
          exit 1

      - name: Check npm audit
        id: npm-audit
        continue-on-error: true
        shell: bash
        run: pnpm audit --prod > npm-audit-check.log 2>&1

      - name: Upload npm audit report
        if: steps.npm-audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce npm audit result
        if: steps.npm-audit.outcome == 'failure'
        shell: bash
        run: |
          tail -n 80 npm-audit-check.log
          exit 1

  validate-fast:
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck contracts
        run: pnpm check:contracts

      - name: Validate MCP runtime
        run: pnpm check:mcp

      - name: Validate plugin API
        run: pnpm check:plugins

      - name: Validate canvas package
        run: pnpm check:canvas

      - name: Validate editor package
        run: pnpm check:editor

      - name: Validate renderer package
        run: pnpm check:renderer

      - name: Validate export package
        run: pnpm check:export

      - name: Validate portal package
        run: pnpm check:portal

      - name: Validate knowledge helpers
        run: pnpm check:knowledge

      - name: Validate citations
        run: pnpm check:citations

      - name: Validate headless bridge
        run: pnpm check:headless

      - name: Lint
        run: pnpm lint

      - name: Rust tests
        run: cargo test --workspace --exclude scriptor-desktop

      - name: Check ts-rs bindings
        run: cargo test -p scriptor-ipc

      - name: Check xtask
        run: cargo xtask release-smoke

  validate-frontend:
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Accessibility smoke
        run: pnpm check:a11y

      - name: axe-core WCAG audit
        run: pnpm check:a11y-axe

      - name: Minimal vault scan budget
        run: cargo run --release -p scriptor-cli -- bench-scan packages/test-fixtures/vaults/minimal --iterations 3

      - name: TUI smoke
        run: pnpm check:tui

      - name: Daemon IPC smoke
        run: pnpm check:daemon

  release-smoke:
    needs: supply-chain
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release smoke
        run: powershell -ExecutionPolicy Bypass -File scripts/release/smoke.ps1 -SkipExportDiscover

      - name: Performance gate (1k scan)
        run: powershell -ExecutionPolicy Bypass -File scripts/release/perf-gate.ps1 -Size 1k

      - name: Canvas interaction budget
        run: pnpm bench:canvas

      - name: Startup budget
        run: pnpm bench:startup

      - name: Idle memory budget
        run: pnpm bench:idle-memory

  container-smoke:
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t scriptor-ci .

      - name: Run container smoke
        run: docker run --rm scriptor-ci
