name: Release
run-name: >-
  ${{
    (inputs.publish && startsWith(github.ref, 'refs/tags/v'))
    && format('Production {0}', github.ref_name)
    || format('Preview {0}', github.ref_name)
  }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only when this workflow is dispatched on an existing v* tag
        required: false
        type: boolean
        default: false
      installer_profile:
        description: Bundled default installer profile preset (complete, developer, researcher, scientific, writer, minimal, focused)
        required: false
        type: choice
        options:
          - complete
          - developer
          - researcher
          - scientific
          - writer
          - minimal
          - focused
        default: complete
      trust_profile:
        description: Release trust profile; native-signed requires platform publisher credentials
        required: false
        type: choice
        options:
          - unsigned
          - native-signed
        default: unsigned
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: .

env:
  SCRIPTOR_RELEASE_VERSION: >-
    ${{
      (inputs.publish && startsWith(github.ref, 'refs/tags/v'))
      && github.ref_name
      || ''
    }}
  SCRIPTOR_RELEASE_CHANNEL: >-
    ${{
      (inputs.publish && startsWith(github.ref, 'refs/tags/v'))
      && 'production'
      || 'preview'
    }}
  SCRIPTOR_TRUST_PROFILE: ${{ inputs.trust_profile || 'unsigned' }}
  SCRIPTOR_SOURCE_COMMIT: ${{ github.sha }}
  # Build channel derived from the tag's pre-release segment.
  # v1.2.3         → lts
  # v1.2.3-beta.*  → beta
  # v1.2.3-alpha.* → alpha
  SCRIPTOR_BUILD_CHANNEL: >-
    ${{
      contains(github.ref_name, '-alpha.') && 'alpha'
      || contains(github.ref_name, '-beta.') && 'beta'
      || 'lts'
    }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  FORCE_COLOR: 1

jobs:
  quality:
    name: Release quality evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_LOG_DIR: artifacts/ci-logs/release-quality
      # Only honored by debug builds so headless CI does not require a desktop
      # secret-service daemon. Packaged release binaries use the OS keychain.
      SCRIPTOR_TEST_DAEMON_HMAC_KEY: release-quality-daemon-hmac-key-0000000000000001
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Configure pinned pnpm 10.33.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure pinned Rust 1.96.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
          key: release-quality

      - name: Install frozen pnpm dependency graph
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Chromium test runtime
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Run source-bound release quality gate
        shell: bash
        run: node scripts/release/run-release-quality.mjs

      - name: Upload release quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scriptor-release-quality
          path: artifacts/release-quality/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload release quality diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-release-quality-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Package ${{ matrix.platform }}/${{ matrix.architecture }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            architecture: x86_64
            targets: msi,nsis
            artifact: scriptor-windows-x86_64-installers
          - os: macos-15
            platform: macos
            architecture: aarch64
            targets: dmg
            artifact: scriptor-macos-aarch64-installers
          - os: ubuntu-22.04
            platform: linux
            architecture: x86_64
            targets: deb,appimage
            artifact: scriptor-linux-x86_64-installers
          - os: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
            targets: deb,appimage
            artifact: scriptor-linux-aarch64-installers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI_LOG_DIR: artifacts/ci-logs/release-${{ matrix.platform }}-${{ matrix.architecture }}
      SCRIPTOR_PLATFORM: ${{ matrix.platform }}
      SCRIPTOR_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
          key: ${{ matrix.platform }}

      - name: Validate release version and trust policy
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ matrix.platform == 'windows' && inputs.trust_profile == 'native-signed' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'windows' && inputs.trust_profile == 'native-signed' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ matrix.platform == 'windows' && inputs.trust_profile == 'native-signed' && vars.WINDOWS_TIMESTAMP_URL || '' }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if ($env:SCRIPTOR_RELEASE_CHANNEL -eq 'preview') {
            $canonicalVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
            $env:SCRIPTOR_RELEASE_VERSION = "v$canonicalVersion"
            "SCRIPTOR_RELEASE_VERSION=v$canonicalVersion" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          }
          node scripts/release/version.mjs check
          node scripts/release/validate-signing-policy.mjs --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}" --channel "$env:SCRIPTOR_RELEASE_CHANNEL" --trust-profile "$env:SCRIPTOR_TRUST_PROFILE"

      - name: Verify runner architecture matches target
        shell: pwsh
        run: node scripts/release/verify-runner-architecture.mjs --expected "${{ matrix.architecture }}"

      - name: Describe release packaging scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Release packaging (${{ matrix.platform }}/${{ matrix.architecture }})"

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install Linux packaging dependencies" -FilePath "bash" -ArgumentList @("-lc", "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf xdg-utils") -TimeoutSeconds 900

      - name: Install frozen pnpm dependency graph
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install frozen pnpm dependency graph" -FilePath "pnpm" -ArgumentList @("install", "--frozen-lockfile") -TimeoutSeconds 900

      - name: Import Windows publisher certificate
        if: inputs.trust_profile == 'native-signed' && matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "scriptor-release-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $pfxPath -Force
          if (-not $certificate.Thumbprint) { throw "Imported Windows certificate has no thumbprint." }
          $configPath = Join-Path $env:RUNNER_TEMP "scriptor-tauri-signing.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $configPath -Encoding utf8
          "SCRIPTOR_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "SCRIPTOR_TAURI_SIGNING_CONFIG=$configPath" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Import macOS Developer ID certificate
        if: inputs.trust_profile == 'native-signed' && matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/scriptor-release-signing.p12"
          keychain_path="$RUNNER_TEMP/scriptor-release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n '1s/.*"\(.*\)".*/\1/p')"
          test -n "$identity"
          rm -f "$certificate_path"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          printf 'SCRIPTOR_MACOS_SIGNING_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"

      - name: Build Tauri bundles
        shell: pwsh
        env:
          TAURI_BUNDLE_TARGETS: ${{ matrix.targets }}
          APPLE_ID: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && inputs.trust_profile == 'native-signed' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if ($env:SCRIPTOR_TAURI_SIGNING_CONFIG) {
            $arguments = @("--dir", "apps/desktop", "exec", "tauri", "build", "--config", $env:SCRIPTOR_TAURI_SIGNING_CONFIG)
          } else {
            $arguments = @("--dir", "apps/desktop", "build")
          }
          ./scripts/ci/invoke-logged.ps1 -Name "Build Tauri bundles for ${{ matrix.platform }}/${{ matrix.architecture }}" -FilePath "pnpm" -ArgumentList $arguments -TimeoutSeconds 4800 -HeartbeatSeconds 20

      - name: Verify bundle artifacts and expected target coverage
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Verify bundle artifacts and expected target coverage" -FilePath "node" -ArgumentList @("scripts/release/verify-bundle.mjs", "${{ matrix.platform }}") -TimeoutSeconds 300

      - name: Verify and record release trust status
        shell: pwsh
        run: >-
          node scripts/release/record-target-trust.mjs
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --channel "$env:SCRIPTOR_RELEASE_CHANNEL"
          --trust-profile "$env:SCRIPTOR_TRUST_PROFILE"

      - name: Stage distributable release assets only
        shell: pwsh
        run: >-
          node scripts/release/stage-release-assets.mjs
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --output-dir release-output

      - name: Inventory staged release assets
        if: always()
        shell: pwsh
        run: |
          $inventoryPath = Join-Path $env:CI_LOG_DIR "release-output-inventory.log"
          $lines = @(
            "platform=${{ matrix.platform }}",
            "architecture=${{ matrix.architecture }}",
            "targets=${{ matrix.targets }}",
            "version=$env:SCRIPTOR_RELEASE_VERSION",
            "captured_utc=$([DateTimeOffset]::UtcNow.ToString('o'))"
          )
          foreach ($item in @(Get-ChildItem -LiteralPath release-output -File -ErrorAction SilentlyContinue | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "file=$($item.Name) bytes=$($item.Length) sha256=$hash"
          }
          if ($lines.Count -eq 5) { $lines += "warning=no staged release assets found" }
          $lines | Set-Content -LiteralPath $inventoryPath -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }

      - name: Upload staged release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release-output/*
          if-no-files-found: error

      - name: Remove transient native-signing credentials
        if: always() && inputs.trust_profile == 'native-signed' && (matrix.platform == 'windows' || matrix.platform == 'macos')
        shell: pwsh
        run: |
          if ($env:SCRIPTOR_WINDOWS_CERT_THUMBPRINT) {
            $path = "Cert:\CurrentUser\My\$env:SCRIPTOR_WINDOWS_CERT_THUMBPRINT"
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
          if ($env:SCRIPTOR_TAURI_SIGNING_CONFIG -and (Test-Path -LiteralPath $env:SCRIPTOR_TAURI_SIGNING_CONFIG)) {
            Remove-Item -LiteralPath $env:SCRIPTOR_TAURI_SIGNING_CONFIG -Force
          }
          if ($env:SCRIPTOR_MACOS_SIGNING_KEYCHAIN -and (Test-Path -LiteralPath $env:SCRIPTOR_MACOS_SIGNING_KEYCHAIN)) {
            & security delete-keychain $env:SCRIPTOR_MACOS_SIGNING_KEYCHAIN
          }

      - name: Capture release packaging failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Release packaging (${{ matrix.platform }}/${{ matrix.architecture }})"

      - name: Finalize release packaging evidence
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "Release packaging (${{ matrix.platform }}/${{ matrix.architecture }})" -Status $env:JOB_STATUS

      - name: Upload release packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-release-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build, quality]
    if: >-
      ${{
        inputs.publish && startsWith(github.ref, 'refs/tags/v')
      }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 30
    env:
      CI_LOG_DIR: artifacts/ci-logs/release-publish
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Describe release publication scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "GitHub Release publication"

      - name: Download all staged release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: scriptor-*-installers
          merge-multiple: true

      - name: Download source-bound release quality evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scriptor-release-quality
          path: release-evidence

      - name: Separate installer subjects from trust metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-evidence

          evidence=(release-artifacts/signing-evidence-*.json)
          test "${#evidence[@]}" -eq 4
          mv "${evidence[@]}" release-evidence/

          installers=(release-artifacts/*)
          msi=(release-artifacts/*.msi)
          exe=(release-artifacts/*.exe)
          dmg=(release-artifacts/*.dmg)
          deb=(release-artifacts/*.deb)
          appimage=(release-artifacts/*.AppImage)
          test "${#installers[@]}" -eq 7
          test "${#msi[@]}" -eq 1
          test "${#exe[@]}" -eq 1
          test "${#dmg[@]}" -eq 1
          test "${#deb[@]}" -eq 2
          test "${#appimage[@]}" -eq 2
          test -z "$(find release-artifacts -mindepth 1 -maxdepth 1 -type d -print -quit)"

      - name: Inventory exact installer and metadata sets
        shell: pwsh
        run: |
          $inventoryPath = Join-Path $env:CI_LOG_DIR "publication-inventory.log"
          $lines = @()
          foreach ($directory in @("release-artifacts", "release-evidence")) {
            foreach ($item in @(Get-ChildItem -LiteralPath $directory -File | Sort-Object Name)) {
              $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $line = "file=$directory/$($item.Name) bytes=$($item.Length) sha256=$hash"
              $lines += $line
              Write-Host $line
            }
          }
          if ($lines.Count -ne 13) { throw "Expected 7 installers, 4 trust records, and 2 quality evidence files; found $($lines.Count) files." }
          $lines | Set-Content -LiteralPath $inventoryPath -Encoding utf8

      - name: Verify architecture-bound release trust evidence
        shell: bash
        run: node scripts/release/verify-signing-evidence.mjs release-evidence "$SCRIPTOR_RELEASE_CHANNEL" "$SCRIPTOR_TRUST_PROFILE"

      - name: Generate source-bound release evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/generate-sbom.mjs release-evidence
          node scripts/release/create-receipt.mjs release-artifacts release-evidence
          node scripts/release/verify-release-evidence.mjs release-artifacts release-evidence

      - name: Attest exact installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/*

      - name: Attest exact installer SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/*
          sbom-path: release-evidence/scriptor.cyclonedx.json

      - name: Verify installer provenance and CycloneDX attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-github-attestations.mjs release-artifacts release-evidence

      - name: Create and verify unified release evidence graph
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/create-evidence-graph.mjs release-artifacts release-evidence
          node scripts/release/verify-evidence-graph.mjs release-artifacts release-evidence

      - name: Create or update GitHub Release and attach verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## Verification notice

          Every installer is bound to this tag by SHA-256, a CycloneDX 1.7 SBOM, a source-bound release receipt, and GitHub provenance/SBOM attestations.

          Before running an installer:

          1. Download the installer, `SHA256SUMS`, `scriptor.cyclonedx.json`, `release-receipt.json`, and `release-evidence-graph.json`.
          2. Set `installer` to the downloaded filename and verify only its checksum: `installer="<installer filename>"; grep -F "  $installer" SHA256SUMS | sha256sum --check -`.
          3. Verify GitHub provenance and SBOM attestations with `gh attestation verify <installer> --repo AmirrezaFarnamTaheri/Scriptor`.

          Trust profile details are recorded per platform in the release receipt and evidence graph. Under `native-signed`, Windows installers are Authenticode-verified and macOS artifacts are Developer-ID-signed and notarized; Linux remains checksum/provenance-backed. Under `unsigned`, all installers remain explicitly unsigned. Full platform-specific verification commands are documented in `docs/RELEASE-SECURITY.md` at this tag.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Scriptor $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Scriptor $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find release-artifacts release-evidence -type f -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Capture release publication failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "GitHub Release publication"

      - name: Finalize release publication evidence
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "GitHub Release publication" -Status $env:JOB_STATUS

      - name: Upload release publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-release-publish-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

  publish-update-manifests:
    name: Publish LTS update manifests
    needs: publish
    # Only run for manually approved LTS tags — no pre-release segment.
    if: >-
      ${{
        inputs.publish && startsWith(github.ref, 'refs/tags/v') &&
        !contains(github.ref_name, '-beta.') &&
        !contains(github.ref_name, '-alpha.')
      }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 15
    env:
      CI_LOG_DIR: artifacts/ci-logs/publish-update-manifests
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Download all staged release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: scriptor-*-installers
          merge-multiple: true

      - name: Generate per-platform update manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/generate-update-manifests.mjs \
            --version "$GITHUB_REF_NAME" \
            --assets-dir release-artifacts \
            --out-dir update-manifests

      - name: Attach manifests to the immutable version release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" update-manifests/*.json --clobber

      - name: Finalize update-manifest evidence
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "LTS update manifest publication" -Status $env:JOB_STATUS

      - name: Upload update-manifest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-update-manifests-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14
