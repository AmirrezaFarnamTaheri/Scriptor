name: Apply unified AgentStack sync implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-unified-agentstack-sync
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/unified-agentstack-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/unified-agentstack-sync
          fetch-depth: 0

      - name: Materialize reviewed implementation
        run: node scripts/apply-unified-agentstack-sync.mjs

      - name: Commit atomic implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(desktop): unify AgentStack sharing and sync"
          git push origin HEAD:feat/unified-agentstack-sync
