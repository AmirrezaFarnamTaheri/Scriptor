name: Release Kickoff
run-name: Create tag and publish VERSION from ${{ github.sha }}

on:
  # Release v1.3.1 only after exact-commit CI passes on the default branch.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Exact VERSION value to tag and publish (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    concurrency:
      group: release-kickoff-validation
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0

      - name: Gate automated release to exact validated v1.3.1 head
        id: eligibility
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            if [ "$GITHUB_SHA" != "$SOURCE_SHA" ]; then
              echo "::notice::CI succeeded on another commit; skip stale release kickoff."
              exit 0
            fi
            if [ "$(tr -d '[:space:]' < VERSION)" != "1.3.1" ]; then
              echo "::notice::Automatic release is only enabled for v1.3.1."
              exit 0
            fi
            if git ls-remote origin refs/tags/v1.3.1 | grep -q .; then
              echo "::notice::v1.3.1 already tagged; no repeat dispatch."
              exit 0
            fi
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Validate synchronized version contract
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_run' && '1.3.1' || inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"; then
            echo "::error title=Release branch mismatch::Release Kickoff must run from $EXPECTED_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if ! test "$version" = "$EXPECTED_VERSION"; then
            echo "::error title=Release version mismatch::Requested $EXPECTED_VERSION, but VERSION contains $version. Synchronize and merge the release version before retrying." >&2
            exit 1
          fi
          SCRIPTOR_RELEASE_VERSION="v$version" node scripts/release/version.mjs check
          successful_ci_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
          if ! test "$successful_ci_runs" -gt 0; then
            echo "::error title=CI prerequisite missing::No successful CI push run found for commit $GITHUB_SHA. Wait for the exact-commit main CI to pass before retrying." >&2
            exit 1
          fi

  tag-and-dispatch:
    needs: validate-release
    if: needs.validate-release.outputs.eligible == 'true'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    concurrency:
      group: release-kickoff-publish
      # Once validation has completed, never cancel the tag-and-dispatch side
      # effects midway through an immutable tag publication.
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create immutable version tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          existing_commit=$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')
          if [ -z "$existing_commit" ]; then
            existing_commit=$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')
          fi
          if [ -n "$existing_commit" ] && [ "$existing_commit" != "$GITHUB_SHA" ]; then
            echo "Tag $tag already points to $existing_commit; refusing to move or reuse it." >&2
            exit 1
          fi
          if [ -z "$existing_commit" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Scriptor $tag"
            git push origin "refs/tags/$tag"
          else
            echo "Tag $tag already points to this release commit; re-dispatching publication."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch production workflow on immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run release.yml
          --ref "${{ steps.tag.outputs.tag }}"
          -f publish=true
