name: Visual review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: visual-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

env:
  FORCE_COLOR: 1

jobs:
  visual-review:
    name: Windows visual regression
    if: github.event.pull_request.draft == false
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI_LOG_DIR: artifacts/ci-logs/visual-review
      PLAYWRIGHT_CHANNEL: msedge
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22 with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Describe visual review scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Visual regression review"

      - name: Install frozen pnpm dependency graph
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install frozen pnpm dependency graph" -FilePath "pnpm" -ArgumentList @("install", "--frozen-lockfile") -TimeoutSeconds 900

      - name: Install Playwright FFmpeg runtime
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install Playwright FFmpeg runtime" -FilePath "pnpm" -ArgumentList @("exec", "playwright", "install", "ffmpeg") -TimeoutSeconds 900

      - name: Compare against committed visual baselines
        id: visual_compare
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Compare against committed visual baselines" -FilePath "pnpm" -ArgumentList @("exec", "playwright", "test", "--config", "playwright.visual.config.ts", "--update-snapshots=none") -TimeoutSeconds 1800 -HeartbeatSeconds 20

      - name: Refresh current visual baselines
        id: visual_refresh
        if: ${{ steps.visual_compare.outcome != 'success' && !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Refresh current visual baselines" -FilePath "pnpm" -ArgumentList @("exec", "playwright", "test", "--config", "playwright.visual.config.ts", "--update-snapshots=all", "--output=test-results/visual-refresh") -TimeoutSeconds 1800 -HeartbeatSeconds 20

      - name: Enforce visual review result and committed baselines
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        env:
          VISUAL_COMPARE_OUTCOME: ${{ steps.visual_compare.outcome }}
          VISUAL_REFRESH_OUTCOME: ${{ steps.visual_refresh.outcome }}
        run: |
          if ($env:VISUAL_COMPARE_OUTCOME -eq 'success') {
            Write-Host "Committed visual baselines match the current UI; diagnostic refresh was not needed."
            exit 0
          }

          $failed = $false
          $changes = git status --porcelain -- e2e/visual-review.spec.ts-snapshots e2e/screenshots.spec.ts-snapshots docs/assets/screenshots

          if ($env:VISUAL_REFRESH_OUTCOME -ne 'success') {
            Write-Host "::error title=Visual baseline refresh failed::The comparison failed and the diagnostic refresh could not produce current baselines."
            $failed = $true
          }
          elseif ($changes) {
            Write-Host $changes
            Write-Host "::error title=Visual baselines are stale::Current captures differ from committed snapshots or documentation screenshots. Review the unified artifact and commit the refreshed images."
            $failed = $true
          }
          else {
            Write-Host "::error title=Visual comparison failed::The comparison failed even though a diagnostic refresh produced no baseline drift."
            $failed = $true
          }

          if ($failed) {
            throw "Visual review failed. Inspect visual-review.zip/images/ for the current captures and comparison evidence."
          }

      - name: Capture visual review failure context
        if: ${{ failure() && !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Visual regression review"

      - name: Finalize visual review evidence
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "Visual regression review" -Status $env:JOB_STATUS

      - name: Prepare unified visual review artifact
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/prepare-visual-review-package.ps1 -PackageRoot "artifacts/visual-review-package" -EvidenceRoot "${{ env.CI_LOG_DIR }}"

      - name: Upload unified visual review artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review
          path: artifacts/visual-review-package
          if-no-files-found: error
          overwrite: true
          retention-days: 14
