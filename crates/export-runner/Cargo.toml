[package]
name = "scriptor-export-runner"
version = "1.2.8"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
inprocess-pdf = ["dep:typst", "dep:typst-layout", "dep:typst-pdf", "dep:typst-assets", "dep:pulldown-cmark"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scriptor-system-bridge = { path = "../system-bridge" }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
log = "0.4"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13.4", optional = true, default-features = false }
typst = { version = "=0.15.1", optional = true }
typst-layout = { version = "=0.15.1", optional = true }
typst-pdf = { version = "=0.15.1", optional = true }
typst-assets = { version = "=0.15.1", optional = true, features = ["fonts"] }

[dev-dependencies]
tempfile = "3"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
