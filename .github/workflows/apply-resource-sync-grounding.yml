name: Apply resource sync grounding corrections

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/.resource-sync-grounding/READY

permissions:
  contents: write

concurrency:
  group: apply-resource-sync-grounding
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/unified-agentstack-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/unified-agentstack-sync
          fetch-depth: 0

      - name: Materialize checksummed corrections
        run: node scripts/apply-resource-sync-grounding.mjs

      - name: Commit grounded implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(desktop): ground resource target contracts"
          git push origin HEAD:feat/unified-agentstack-sync
