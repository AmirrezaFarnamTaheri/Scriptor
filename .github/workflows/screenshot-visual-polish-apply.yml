name: One-time screenshot visual polish apply

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: screenshot-visual-polish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply reviewed screenshot polish
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply reviewed patch and push
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/visual-polish.patch

          if git apply --check /tmp/visual-polish.patch; then
            git apply /tmp/visual-polish.patch
          elif git apply --reverse --check /tmp/visual-polish.patch; then
            echo "Reviewed patch is already applied."
            exit 0
          else
            echo "Reviewed patch no longer applies cleanly." >&2
            exit 1
          fi

          git diff --check
          node scripts/release/verify-changelog.mjs
          node scripts/validation/frontend-quality.mjs
          node scripts/validation/css-custom-properties.mjs
          node scripts/validation/i18n-parity.mjs
          node scripts/validation/deep-module-boundaries.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(ui): polish screenshot-reviewed workspace surfaces"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
