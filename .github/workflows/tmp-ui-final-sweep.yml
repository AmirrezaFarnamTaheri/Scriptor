name: Apply final UI audit sweep

on:
  push:
    branches:
      - fix/visual-review-shell-and-surfaces

permissions:
  contents: write

jobs:
  apply-final-sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/visual-review-shell-and-surfaces
          fetch-depth: 0
      - name: Apply final sweep
        shell: bash
        run: |
          python .github/scripts/ui-final-sweep.py
          rm -f .github/scripts/ui-final-sweep.py .github/workflows/tmp-ui-final-sweep.yml .github/ui-final-sweep-trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ui): close final visual audit gaps'
          git push origin HEAD:fix/visual-review-shell-and-surfaces
