name: Reconcile convergence lockfiles

on:
  push:
    branches:
      - convergence/all-open-prs-2026-07-29
    paths:
      - .github/workflows/convergence-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/cli/Cargo.toml
      - crates/canvas-engine/Cargo.toml
      - .github/workflows/convergence-lockfile.yml

permissions:
  contents: write

concurrency:
  group: convergence-lockfiles
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@v7
        with:
          ref: convergence/all-open-prs-2026-07-29
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Normalize TUI terminal lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/cli/src/tui.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """use crossterm::{
              event::{self, Event, KeyCode, KeyEventKind},
              execute,
              terminal::{disable_raw_mode, enable_raw_mode, EnterAlternateScreen, LeaveAlternateScreen},
          };
          """,
                  "use crossterm::event::{self, Event, KeyCode, KeyEventKind};\n",
              ),
              (
                  """impl TerminalGuard {
              fn enter() -> Result<(Self, DefaultTerminal), Box<dyn std::error::Error>> {
                  enable_raw_mode()?;
                  let mut stdout = std::io::stdout();
                  execute!(stdout, EnterAlternateScreen)?;
                  Ok((Self, ratatui::init()))
              }
          }

          impl Drop for TerminalGuard {
              fn drop(&mut self) {
                  let _ = disable_raw_mode();
                  let _ = execute!(std::io::stdout(), LeaveAlternateScreen);
                  ratatui::restore();
              }
          }
          """,
                  """impl TerminalGuard {
              fn enter() -> Result<(Self, DefaultTerminal), Box<dyn std::error::Error>> {
                  Ok((Self, ratatui::try_init()?))
              }
          }

          impl Drop for TerminalGuard {
              fn drop(&mut self) {
                  ratatui::restore();
              }
          }
          """,
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one TUI lifecycle pattern, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          rustfmt --edition 2024 crates/cli/src/tui.rs

      - name: Regenerate combined npm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen npm install
        run: pnpm install --frozen-lockfile

      - name: Regenerate aligned Cargo lockfile
        shell: bash
        run: |
          cargo update -p ratatui --precise 0.30.2
          cargo check --workspace --exclude scriptor-desktop --locked

      - name: Verify integrated dependency invariants
        shell: bash
        run: |
          grep -F '"@types/node": "^26.1.2"' package.json
          grep -F "'@types/node@26.1.2':" pnpm-lock.yaml

          grep -F 'ratatui = "0.30.2"' crates/cli/Cargo.toml
          test "$(grep -c '^name = "crossterm"$' Cargo.lock)" -eq 1
          grep -A1 '^name = "crossterm"$' Cargo.lock | grep -F 'version = "0.29.0"'
          grep -F 'ratatui::try_init()?' crates/cli/src/tui.rs
          ! grep -q 'enable_raw_mode\|EnterAlternateScreen\|LeaveAlternateScreen' crates/cli/src/tui.rs

          grep -F 'resvg = "0.47"' crates/canvas-engine/Cargo.toml
          grep -F 'tiny-skia = "0.12"' crates/canvas-engine/Cargo.toml
          test "$(grep -c '^name = "resvg"$' Cargo.lock)" -eq 1
          test "$(grep -c '^name = "usvg"$' Cargo.lock)" -eq 1
          test "$(grep -c '^name = "tiny-skia"$' Cargo.lock)" -eq 1
          grep -A1 '^name = "resvg"$' Cargo.lock | grep -F 'version = "0.47.0"'
          grep -A1 '^name = "usvg"$' Cargo.lock | grep -F 'version = "0.47.0"'
          grep -A1 '^name = "tiny-skia"$' Cargo.lock | grep -F 'version = "0.12.0"'

      - name: Commit reconciled sources and lockfiles
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml Cargo.lock crates/cli/src/tui.rs; then
            echo "Sources and lockfiles already match the combined manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml Cargo.lock crates/cli/src/tui.rs
          git commit -m "chore(deps): reconcile unified dependency graph"
          git push origin HEAD:convergence/all-open-prs-2026-07-29
