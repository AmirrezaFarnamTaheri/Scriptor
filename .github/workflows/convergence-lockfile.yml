name: Reconcile convergence lockfiles

on:
  push:
    branches:
      - convergence/all-open-prs-2026-07-29
    paths:
      - package.json
      - pnpm-lock.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/cli/Cargo.toml
      - crates/cli/src/tui.rs
      - crates/canvas-engine/Cargo.toml
      - crates/tantivy-indexer/src/lib.rs
      - src/lib/monaco-environment.ts
      - src/workers/**
      - src/types/monaco-workers.d.ts
      - scripts/ci/reconcile-convergence.sh
      - .github/workflows/convergence-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/cli/Cargo.toml
      - crates/cli/src/tui.rs
      - crates/canvas-engine/Cargo.toml
      - crates/tantivy-indexer/src/lib.rs
      - src/lib/monaco-environment.ts
      - src/workers/**
      - src/types/monaco-workers.d.ts
      - scripts/ci/reconcile-convergence.sh
      - .github/workflows/convergence-lockfile.yml

permissions:
  contents: read

concurrency:
  group: convergence-lockfiles-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate unified dependency graph without writes
        env:
          RECONCILE_WRITE: '0'
        run: bash scripts/ci/reconcile-convergence.sh

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/convergence/all-open-prs-2026-07-29'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out trusted convergence branch
        uses: actions/checkout@v7
        with:
          ref: convergence/all-open-prs-2026-07-29
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconcile and commit unified dependency graph
        env:
          RECONCILE_WRITE: '1'
        run: bash scripts/ci/reconcile-convergence.sh
