name: Agent apply incremental remediation 01
on:
  push:
    branches: [agent/comprehensive-product-remediation]
    paths:
      - '.agent-remediation/inc01.b64'
      - '.github/workflows/agent-apply-incremental-01.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reassemble and verify commit series
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent-remediation/inc01.b64 | gunzip > /tmp/inc01.mbox
          echo "162f97078885be16dd9144bc58b76b24965e42fc20e37a27bfa3b8d2757d7937  /tmp/inc01.mbox" | sha256sum --check
      - name: Apply audited commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/inc01.mbox
          rm .agent-remediation/inc01.b64
          git add -A
          git commit -m "chore(agent): clear incremental remediation staging"
          git push origin HEAD:agent/comprehensive-product-remediation
