name: PR112 surgical patch

on:
  push:
    branches:
      - fix/visual-review-shell-and-surfaces

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): apply PR112 surgical patches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visual-review-shell-and-surfaces
          fetch-depth: 0

      - name: Apply targeted integration fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function read(path) { return fs.readFileSync(path, 'utf8') }
          function write(path, text) { fs.writeFileSync(path, text) }
          function replaceOnce(text, oldText, newText, label) {
            const first = text.indexOf(oldText)
            if (first < 0) throw new Error(`Missing replacement target: ${label}`)
            if (text.indexOf(oldText, first + oldText.length) >= 0) throw new Error(`Ambiguous replacement target: ${label}`)
            return text.slice(0, first) + newText + text.slice(first + oldText.length)
          }

          // App.tsx is intentionally still identical to main; keep this patch
          // surgical rather than replacing the ~2k-line shell via Contents API.
          {
            const path = 'src/App.tsx'
            let text = read(path)
            text = replaceOnce(
              text,
              "import { extractPandocCitationKeys } from './lib/citationExtract'\n",
              "import { extractPandocCitationKeys } from './lib/citationExtract'\nimport { mutateVaultConfig } from './lib/vaultConfigMutation'\n",
              'App mutateVaultConfig import',
            )
            text = replaceOnce(
              text,
              "  vaultSaveNote,\n  vaultSaveConfig,\n  codeChunkRun,\n",
              "  vaultSaveNote,\n  codeChunkRun,\n",
              'App remove direct vaultSaveConfig import',
            )
            text = replaceOnce(
              text,
              "          onPull={() => void workspace.pullRemote()}\n",
              "          onPull={(strategy) => void workspace.pullRemote(strategy)}\n",
              'App forward pull strategy',
            )
            text = replaceOnce(
              text,
              "      ['Words', draftWordCount.toLocaleString()],\n      ['Vault words', (workspace.health?.total_words ?? 0).toLocaleString()],\n",
              "      ['Words', draftWordCount.toLocaleString()],\n",
              'App keep inspector metrics note-scoped',
            )
            const oldTarget = `          onDailyTargetChange={(value) => {\n            workspace.setVaultConfig((current) => ({\n              ...current,\n              writing_targets: {\n                ...current.writing_targets,\n                daily_words: value,\n                history_path: current.writing_targets?.history_path ?? '.scriptor/stats-history.json',\n              },\n            }))\n            if (nativeReady) {\n              void vaultSaveConfig({\n                ...workspace.vaultConfig,\n                writing_targets: {\n                  ...workspace.vaultConfig.writing_targets,\n                  daily_words: value,\n                  history_path: workspace.vaultConfig.writing_targets?.history_path ?? '.scriptor/stats-history.json',\n                },\n              })\n            }\n          }}\n`
            const newTarget = `          onDailyTargetChange={(value) => {\n            workspace.setVaultConfig((current) => ({\n              ...current,\n              writing_targets: {\n                ...current.writing_targets,\n                daily_words: value,\n                history_path: current.writing_targets?.history_path ?? '.scriptor/stats-history.json',\n              },\n            }))\n            if (nativeReady) {\n              void mutateVaultConfig((current) => ({\n                ...current,\n                writing_targets: {\n                  ...current.writing_targets,\n                  daily_words: value,\n                  history_path: current.writing_targets?.history_path ?? '.scriptor/stats-history.json',\n                },\n              })).catch((error) => {\n                workspace.logActivity(\n                  'error',\n                  'Writing target save failed',\n                  error instanceof Error ? error.message : String(error),\n                )\n              })\n            }\n          }}\n`
            text = replaceOnce(text, oldTarget, newTarget, 'App serialized writing target mutation')
            write(path, text)
          }

          // Settings explicit Save participates in the same queue and preserves
          // MCP state that may have changed while the dialog was open.
          {
            const path = 'src/components/SettingsPanel.tsx'
            let text = read(path)
            text = replaceOnce(
              text,
              "import { diagnosticsExportSupportBundle, exportDiscover, vaultLoadConfig, vaultSaveConfig } from '../bridge/commands'\n",
              "import { diagnosticsExportSupportBundle, exportDiscover, vaultLoadConfig } from '../bridge/commands'\nimport { mutateVaultConfig } from '../lib/vaultConfigMutation'\n",
              'Settings config mutation import',
            )
            text = replaceOnce(
              text,
              '      await vaultSaveConfig(config)\n',
              '      await mutateVaultConfig((current) => ({ ...current, ...config, mcp: current.mcp }))\n',
              'Settings serialized save',
            )
            write(path, text)
          }

          // Consent copy must describe the permission set that is actually
          // granted. Optional permissions remain visibly optional and are not
          // silently bundled into the confirmation.
          {
            const path = 'src/components/StorePanel.tsx'
            let text = read(path)
            const oldPermissionExpr = "plugin.manifest.permissions.map((entry) => entry.permission).join(', ')"
            const permissionOccurrences = text.split(oldPermissionExpr).length - 1
            if (permissionOccurrences !== 1) throw new Error(`Expected one permission confirmation expression, found ${permissionOccurrences}`)
            text = text.replace(oldPermissionExpr, "requiredPermissions.join(', ')")
            text = replaceOnce(
              text,
              "                                  plugin.manifest.permissions.map((entry) => entry.permission),\n",
              "                                  requiredPermissions,\n",
              'Store consent passes required permissions only',
            )
            text = text.replaceAll('Revoke access', 'Revoke this vault')
            text = replaceOnce(
              text,
              "                              <small>{plugin.manifest.description}</small>\n",
              "                              <small>{plugin.manifest.description}</small>\n                              {plugin.manifest.permissions.some((entry) => entry.optional) ? (\n                                <small className=\"store-optional-permission-note\">Optional permissions are not granted by default.</small>\n                              ) : null}\n",
              'Store optional permission explanation',
            )
            write(path, text)
          }

          // Keep inspector terminology distinct from the editor's Preview mode.
          for (const [path, label] of [
            ['src/lib/i18n/en.json', 'Rendered output'],
            ['src/lib/i18n/de.json', 'Gerenderte Ausgabe'],
            ['src/lib/i18n/fa.json', 'خروجی رندرشده'],
          ]) {
            const data = JSON.parse(read(path))
            if (!data.inspector?.tabs?.preview) throw new Error(`Missing inspector.tabs.preview in ${path}`)
            data.inspector.tabs.preview = label
            write(path, JSON.stringify(data, null, 2) + '\n')
          }

          // Visual tests must assert the feature being captured, not silently
          // fall back to a different surface after the IA changes.
          {
            const path = 'e2e/screenshots.spec.ts'
            let text = read(path)
            const oldSettingsWait = `async function waitForSettingsReady(page: Page) {\n  const panel = page.getByRole('dialog', { name: 'Settings' })\n  await expect(panel.locator('.settings-panel-content')).toBeVisible()\n  await expect(panel.locator('dd', { hasText: '3.8.2' })).toBeVisible()\n  await expect(panel.locator('dd', { hasText: /Pandoc 3\.8\.2/i })).toBeVisible()\n  await expect(panel.getByRole('button', { name: 'Refresh Pandoc discovery' })).toBeVisible()\n  await settleLayout(page)\n}\n`
            const newSettingsWait = `async function waitForSettingsReady(page: Page) {\n  const panel = page.getByRole('dialog', { name: 'Settings' })\n  await expect(panel.locator('.settings-panel-content')).toBeVisible()\n  await expect(panel.getByRole('tab', { name: 'General', exact: true })).toBeVisible()\n  await expect(panel.getByText(/App preferences save immediately/i)).toBeVisible()\n  await settleLayout(page)\n}\n`
            text = replaceOnce(text, oldSettingsWait, newSettingsWait, 'screenshot Settings readiness')
            text = text.replaceAll("getByText('No issues detected')", "getByText('Vault looks healthy')")
            text = text.replaceAll("getByRole('dialog', { name: 'Resolve merge conflict' })", "getByRole('dialog', { name: 'Resolve merge conflicts' })")
            const oldMcpModes = `  for (const mode of ['off', 'read-only', 'draft', 'write-approved']) {\n    await expect(mcpPanel.getByRole('button', { name: mode, exact: true })).toBeVisible()\n  }\n`
            const newMcpModes = `  const mcpModes = mcpPanel.getByRole('radiogroup', { name: 'MCP authorization level' })\n  for (const mode of ['Off', 'Read only', 'Draft changes', 'Approved writes']) {\n    await expect(mcpModes.getByRole('radio', { name: new RegExp('^' + mode) })).toBeVisible()\n  }\n`
            text = replaceOnce(text, oldMcpModes, newMcpModes, 'screenshot MCP security modes')
            const oldShortcut = `  const shortcutsTab = settingsPanel.getByRole('tab', { name: 'Keyboard shortcuts', exact: true })\n  if (await shortcutsTab.isVisible()) {\n    await shortcutsTab.click()\n    await settleLayout(page)\n  }\n`
            const newShortcut = `  const shortcutsTab = settingsPanel.getByRole('tab', { name: 'Keyboard shortcuts', exact: true })\n  await expect(shortcutsTab).toBeVisible()\n  await shortcutsTab.click()\n  await expect(settingsPanel.getByRole('table', { name: 'Keyboard shortcuts' })).toBeVisible()\n  await settleLayout(page)\n`
            text = replaceOnce(text, oldShortcut, newShortcut, 'screenshot shortcut editor must exist')
            write(path, text)
          }
          NODE

      - name: Commit surgical fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/SettingsPanel.tsx src/components/StorePanel.tsx src/lib/i18n/en.json src/lib/i18n/de.json src/lib/i18n/fa.json e2e/screenshots.spec.ts
          git commit -m 'fix(ui): integrate scoped config, consent, and visual contracts'
          git push origin HEAD:fix/visual-review-shell-and-surfaces
