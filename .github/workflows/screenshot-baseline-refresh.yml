name: One-time screenshot baseline refresh

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: screenshot-baseline-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh reviewed screenshot baselines
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22 with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install Playwright FFmpeg runtime
        shell: pwsh
        run: pnpm exec playwright install ffmpeg

      - name: Stabilize Note History visual assertion
        shell: pwsh
        run: |
          $path = 'e2e/screenshots.spec.ts'
          $lines = [System.Collections.Generic.List[string]](Get-Content $path)
          $start = -1
          $end = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match "const restoreButton = historyPanel") { $start = $i }
            if ($start -ge 0 -and $lines[$i] -match "await settleLayout\(page\)") { $end = $i; break }
          }
          if ($start -lt 0 -or $end -lt $start) { throw 'Could not locate Note History assertion block.' }

          $replacement = @(
            '  await settleLayout(page)',
            "  const restoreButton = historyPanel.getByRole('button', { name: 'Restore revision' })",
            '  const [restoreBox, panelBox] = await Promise.all([restoreButton.boundingBox(), historyPanel.boundingBox()])',
            '  expect(restoreBox).not.toBeNull()',
            '  expect(panelBox).not.toBeNull()',
            '  expect(restoreBox!.width).toBeLessThan(panelBox!.width * 0.25)'
          )
          $lines.RemoveRange($start, $end - $start + 1)
          $lines.InsertRange($start, [string[]]$replacement)
          [System.IO.File]::WriteAllLines($path, $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Refresh only changed visual baselines
        shell: pwsh
        run: pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots=changed

      - name: Upload reviewed refreshed screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-baseline-refresh-${{ github.run_attempt }}
          path: |
            e2e/screenshots.spec.ts-snapshots
            docs/assets/screenshots
            test-results/visual
          if-no-files-found: warn
          retention-days: 7

      - name: Commit reviewed visual repair and remove helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $changes = git status --porcelain -- `
            e2e/screenshots.spec.ts `
            e2e/screenshots.spec.ts-snapshots `
            docs/assets/screenshots
          if ($LASTEXITCODE -ne 0) { throw "git status failed with exit code $LASTEXITCODE" }

          if ($changes) {
            Write-Host $changes
          } else {
            Write-Host 'Reviewed screenshot state is already current; only the one-time helper will be removed.'
          }

          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw "git config user.name failed with exit code $LASTEXITCODE" }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw "git config user.email failed with exit code $LASTEXITCODE" }

          git add -- `
            e2e/screenshots.spec.ts `
            e2e/screenshots.spec.ts-snapshots `
            docs/assets/screenshots
          if ($LASTEXITCODE -ne 0) { throw "git add failed with exit code $LASTEXITCODE" }

          git rm -- .github/workflows/screenshot-baseline-refresh.yml
          if ($LASTEXITCODE -ne 0) { throw "git rm helper failed with exit code $LASTEXITCODE" }

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --cached --check failed with exit code $LASTEXITCODE" }

          git commit -m 'test(ui): refresh screenshot-reviewed baselines'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }

          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
