name: Release
run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Production {0}', github.ref_name) || format('Preview v{0}', github.event.inputs.version || '0.1.0') }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview build version; manual runs do not publish
        required: false
        default: '0.1.0'
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: .

env:
  SCRIPTOR_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version || '0.1.0') }}
  SCRIPTOR_RELEASE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  FORCE_COLOR: 1

jobs:
  build:
    name: Package ${{ matrix.platform }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            targets: msi,nsis
            artifact: scriptor-windows-installers
          - os: macos-15
            platform: macos
            targets: dmg
            artifact: scriptor-macos-installers
          - os: ubuntu-22.04
            platform: linux
            targets: deb,appimage
            artifact: scriptor-linux-installers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI_LOG_DIR: artifacts/ci-logs/release-${{ matrix.platform }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version and signing policy
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          node scripts/release/version.mjs check
          node scripts/release/validate-signing-policy.mjs --platform "${{ matrix.platform }}" --channel "$env:SCRIPTOR_RELEASE_CHANNEL"

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Describe release packaging scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Release packaging (${{ matrix.platform }})"

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install Linux packaging dependencies" -FilePath "bash" -ArgumentList @("-lc", "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf") -TimeoutSeconds 900

      - name: Install frozen pnpm dependency graph
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install frozen pnpm dependency graph" -FilePath "pnpm" -ArgumentList @("install", "--frozen-lockfile") -TimeoutSeconds 900

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::group::Import Apple signing certificate"
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          echo "Signing mode: imported Apple certificate into ephemeral keychain."
          echo "::endgroup::"

      - name: Configure macOS signing and notarization inputs
        if: matrix.platform == 'macos' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: bash
        env:
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "::group::Configure macOS signing and notarization inputs"
          {
            echo "APPLE_SIGNING_IDENTITY=$_APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$_APPLE_ID"
            echo "APPLE_PASSWORD=$_APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Signing mode: Apple Developer ID with notarization."
          echo "::endgroup::"

      - name: Build Tauri bundles for ${{ matrix.platform }}
        shell: pwsh
        env:
          TAURI_BUNDLE_TARGETS: ${{ matrix.targets }}
        run: ./scripts/ci/invoke-logged.ps1 -Name "Build Tauri bundles for ${{ matrix.platform }}" -FilePath "pnpm" -ArgumentList @("--dir", "apps/desktop", "build") -TimeoutSeconds 4800 -HeartbeatSeconds 20

      - name: Verify bundle artifacts and expected target coverage
        shell: pwsh
        env:
          SCRIPTOR_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/ci/invoke-logged.ps1 -Name "Verify bundle artifacts and expected target coverage" -FilePath "node" -ArgumentList @("scripts/release/verify-bundle.mjs", "${{ matrix.platform }}") -TimeoutSeconds 300

      - name: Sign and verify Windows production installers
        if: matrix.platform == 'windows' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/invoke-logged.ps1 -Name "Sign Windows installers when certificate is configured" -FilePath "pwsh" -ArgumentList @("-NoProfile", "-File", "scripts/release/sign-installers.ps1") -TimeoutSeconds 900

      - name: Write Windows release manifest
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/invoke-logged.ps1 -Name "Write Windows release manifest" -FilePath "pwsh" -ArgumentList @("-NoProfile", "-File", "scripts/release/write-manifest.ps1") -TimeoutSeconds 300

      - name: Verify Windows release manifest
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Verify Windows release manifest" -FilePath "pwsh" -ArgumentList @("-NoProfile", "-File", "scripts/release/verify-manifest.ps1") -TimeoutSeconds 300

      - name: Sign and verify Linux production bundles
        if: matrix.platform == 'linux' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: bash
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/scriptor-linux-signing-key.asc"
          printf %s "$LINUX_SIGNING_KEY" | base64 --decode > "$key_file"
          gpg --batch --import "$key_file"
          bundles=()
          while IFS= read -r -d '' bundle; do
            bundles+=("$bundle")
          done < <(find target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) -print0)
          test "${#bundles[@]}" -gt 0
          for bundle in "${bundles[@]}"; do
            gpg --batch --yes --armor --detach-sign "$bundle"
            gpg --verify "$bundle.asc" "$bundle"
          done
          gpg --armor --export > target/release/bundle/scriptor-release-public-key.asc
          rm -f "$key_file"

      - name: Verify macOS production signatures and notarization
        if: matrix.platform == 'macos' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          apps=()
          while IFS= read -r -d '' app; do
            apps+=("$app")
          done < <(find target/release/bundle -type d -name "*.app" -print0)
          dmgs=()
          while IFS= read -r -d '' dmg; do
            dmgs+=("$dmg")
          done < <(find target/release/bundle -type f -name "*.dmg" -print0)
          test "${#apps[@]}" -gt 0
          test "${#dmgs[@]}" -gt 0
          for app in "${apps[@]}"; do codesign --verify --deep --strict --verbose=2 "$app"; done
          for dmg in "${dmgs[@]}"; do xcrun stapler validate "$dmg"; done

      - name: Record Windows production signing evidence
        if: matrix.platform == 'windows' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: pwsh
        run: node scripts/release/write-signing-evidence.mjs --platform windows --channel production --signed true --notarized false --signature-type authenticode --verifier "signtool verify /pa"

      - name: Record macOS production signing evidence
        if: matrix.platform == 'macos' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: pwsh
        run: node scripts/release/write-signing-evidence.mjs --platform macos --channel production --signed true --notarized true --signature-type developer-id --verifier "codesign --verify and xcrun stapler validate"

      - name: Record Linux production signing evidence
        if: matrix.platform == 'linux' && env.SCRIPTOR_RELEASE_CHANNEL == 'production'
        shell: pwsh
        run: node scripts/release/write-signing-evidence.mjs --platform linux --channel production --signed true --notarized false --signature-type openpgp --verifier "gpg --verify"

      - name: Record unsigned preview evidence
        if: env.SCRIPTOR_RELEASE_CHANNEL == 'preview'
        shell: pwsh
        run: node scripts/release/write-signing-evidence.mjs --platform "${{ matrix.platform }}" --channel preview --signed false --notarized false --signature-type none --verifier "preview channel; publication disabled"

      - name: Inventory generated bundles
        if: always()
        shell: pwsh
        run: |
          $inventoryPath = Join-Path $env:CI_LOG_DIR "bundle-inventory.log"
          $roots = @("target/release/bundle", "dist/release-manifest.json")
          $lines = @(
            "platform=${{ matrix.platform }}",
            "targets=${{ matrix.targets }}",
            "version=$env:SCRIPTOR_RELEASE_VERSION",
            "captured_utc=$([DateTimeOffset]::UtcNow.ToString('o'))"
          )
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) {
              $lines += "missing=$root"
              continue
            }
            foreach ($item in @(Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName)) {
              $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $lines += "file=$($item.FullName) bytes=$($item.Length) sha256=$hash"
            }
          }
          $lines | Set-Content -LiteralPath $inventoryPath -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }
          "| Inventory generated bundles | PASS | - | 0 | ``bundle-inventory.log`` |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload Windows installers and manifest
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/**/*
            dist/release-manifest.json
          if-no-files-found: error

      - name: Upload macOS or Linux installers
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/**/*
          if-no-files-found: error

      - name: Clean up Apple signing material
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          echo "::group::Clean up Apple signing material"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security delete-keychain build.keychain 2>/dev/null || true
          echo "Ephemeral certificate and keychain cleanup complete."
          echo "::endgroup::"

      - name: Capture release packaging failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Release packaging (${{ matrix.platform }})"

      - name: Finalize release packaging evidence
        if: always()
        shell: pwsh
        run: ./scripts/ci/finalize-job.ps1 -Scope "Release packaging (${{ matrix.platform }})" -Status "${{ job.status }}"

      - name: Upload release packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-release-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    env:
      CI_LOG_DIR: artifacts/ci-logs/release-publish
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Describe release publication scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "GitHub Release publication"

      - name: Download all installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Inventory downloaded release artifacts
        shell: pwsh
        run: |
          $inventoryPath = Join-Path $env:CI_LOG_DIR "publication-inventory.log"
          $lines = @()
          foreach ($item in @(Get-ChildItem -LiteralPath release-artifacts -Recurse -File | Sort-Object FullName)) {
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "file=$($item.FullName) bytes=$($item.Length) sha256=$hash"
            $lines += $line
            Write-Host $line
          }
          if ($lines.Count -eq 0) { throw "No downloaded release artifacts were found." }
          $lines | Set-Content -LiteralPath $inventoryPath -Encoding utf8
          "| Inventory downloaded release artifacts | PASS | - | 0 | ``publication-inventory.log`` |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Verify fail-closed platform signing evidence
        shell: bash
        run: node scripts/release/verify-signing-evidence.mjs release-artifacts "$SCRIPTOR_RELEASE_CHANNEL"

      - name: Generate source-bound release evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/generate-sbom.mjs release-evidence
          node scripts/release/create-receipt.mjs release-artifacts release-evidence
          node scripts/release/verify-release-evidence.mjs release-artifacts release-evidence

      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release-artifacts/**/*
          sbom-path: release-evidence/scriptor.cyclonedx.json

      - name: Create or update GitHub Release and attach verified installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Scriptor $GITHUB_REF_NAME"
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release-artifacts release-evidence -type f -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Capture release publication failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "GitHub Release publication"

      - name: Finalize release publication evidence
        if: always()
        shell: pwsh
        run: ./scripts/ci/finalize-job.ps1 -Scope "GitHub Release publication" -Status "${{ job.status }}"

      - name: Upload release publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-release-publish-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14
