name: Apply integration fixups

on:
  push:
    branches: [integrate/open-prs-v0.1.1]
    paths:
      - .github/workflows/integration-fixups.yml

permissions:
  contents: write

concurrency:
  group: apply-integration-fixups-v0.1.1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integrate/open-prs-v0.1.1
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              if old not in content:
                  raise SystemExit(f'missing expected text in {path}')
              target.write_text(content.replace(old, new, 1))

          canvas = Path('e2e/canvas.spec.ts')
          content = canvas.read_text()
          content, count = re.subn(
              r'async function enableCanvasKit\(page: Page\): Promise<void> \{.*?\n\}\n\n',
              '',
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not remove obsolete Canvas Kit install setup')
          if '  await enableCanvasKit(page)\n' not in content:
              raise SystemExit('missing Canvas Kit setup call')
          canvas.write_text(content.replace(
              '  await enableCanvasKit(page)\n',
              '  await waitForWorkspace(page)\n',
              1,
          ))

          preview = Path('e2e/preview-resilience.spec.ts')
          content = preview.read_text().replace(
              "      window.localStorage.setItem('scriptor:split-preview', 'false')\n",
              '',
              1,
          )
          old = "  test('extension failures preserve inspector and split preview content', async ({ page }) => {\n    await page.getByRole('tab', { name: 'Preview', exact: true }).click()\n"
          new = "  test('extension failures preserve inspector and split preview content', async ({ page }) => {\n    const editorToolbar = page.locator('.editor-toolbar')\n    const sourceButton = editorToolbar.getByRole('button', { name: 'Source', exact: true })\n    if (await sourceButton.isVisible()) {\n      await sourceButton.click()\n    }\n\n    await page.getByRole('tab', { name: 'Preview', exact: true }).click()\n"
          if old not in content:
              raise SystemExit('missing preview test setup')
          content = content.replace(old, new, 1)
          old = "    await page\n      .locator('.editor-toolbar')\n      .getByRole('button', { name: 'Split', exact: true })\n      .click()\n"
          if old not in content:
              raise SystemExit('missing split-preview click')
          preview.write_text(content.replace(
              old,
              "    await editorToolbar.getByRole('button', { name: 'Split', exact: true }).click()\n",
              1,
          ))

          toolbar = Path('e2e/toolbar-popovers.spec.ts')
          content = toolbar.read_text()
          changes = (
              ("      const trigger = toolbar.getByRole('button', { name: new RegExp(menuName, 'i') })", "      const trigger = toolbar.getByRole('button', { name: menuName, exact: true })"),
              ('      const toolbarBox = await toolbar.boundingBox()', '      const triggerBox = await trigger.boundingBox()'),
              ('      expect(toolbarBox).not.toBeNull()', '      expect(triggerBox).not.toBeNull()'),
              ("      expect(menuBox?.y).toBeGreaterThan((toolbarBox?.y ?? 0) + (toolbarBox?.height ?? 0) - 2)", "      expect(menuBox?.y).toBeGreaterThanOrEqual((triggerBox?.y ?? 0) + (triggerBox?.height ?? 0))"),
          )
          for old, new in changes:
              if old not in content:
                  raise SystemExit(f'missing toolbar assertion: {old}')
              content = content.replace(old, new, 1)
          toolbar.write_text(content)

          replace(
              'src/components/ResourceSyncPanel.tsx',
              "  useEffect(() => {\n    void refresh()\n  }, [refresh])",
              "  useEffect(() => {\n    if (!nativeAvailable) return undefined\n\n    const frame = window.requestAnimationFrame(() => {\n      void refresh()\n    })\n\n    return () => window.cancelAnimationFrame(frame)\n  }, [nativeAvailable, refresh])",
          )
          replace(
              'scripts/validation/source-contracts.mjs',
              'assert.match(receipt, /schemaVersion:\\s*3/)',
              'assert.match(receipt, /schemaVersion:\\s*4/)',
          )

          Path('.github/workflows/apply-grounded-resource-corrections.yml').unlink()
          Path('scripts/apply-resource-sync-grounding.mjs').unlink()
          shutil.rmtree('scripts/.resource-sync-grounding')
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          node scripts/release/version.mjs check
          node scripts/validation/source-contracts.mjs
          node scripts/validation/desktop-branding.mjs
          node scripts/validation/authorization-inventory.mjs
          node --test scripts/validation/resource-sync-contracts.test.mjs scripts/validation/release-hardening-contracts.test.mjs
          git diff --check

      - name: Commit fixups
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): reconcile unified PR contracts"
          git push origin HEAD:integrate/open-prs-v0.1.1
