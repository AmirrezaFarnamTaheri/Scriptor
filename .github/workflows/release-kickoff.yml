name: Release Kickoff
run-name: Create tag and publish VERSION from ${{ github.sha }}

on:
  # Publish the canonical VERSION only after exact-commit CI passes on the default branch.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Exact VERSION value to tag and publish (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    env:
      CI_LOG_DIR: artifacts/ci-logs/pretag-release-quality
      SCRIPTOR_TEST_DAEMON_HMAC_KEY: release-quality-daemon-hmac-key-0000000000000001
    concurrency:
      group: release-kickoff-validation
      cancel-in-progress: true
    timeout-minutes: 100
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0

      - name: Gate automated release to exact validated VERSION head
        id: eligibility
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/kickoff-eligibility.sh

      - name: Validate synchronized version contract
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"; then
            echo "::error title=Release branch mismatch::Release Kickoff must run from $EXPECTED_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && ! test "$version" = "$EXPECTED_VERSION"; then
            echo "::error title=Release version mismatch::Requested $EXPECTED_VERSION, but VERSION contains $version. Synchronize and merge the release version before retrying." >&2
            exit 1
          fi
          SCRIPTOR_RELEASE_VERSION="v$version" node scripts/release/version.mjs check
          successful_ci_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
          if ! test "$successful_ci_runs" -gt 0; then
            echo "::error title=CI prerequisite missing::No successful CI push run found for commit $GITHUB_SHA. Wait for the exact-commit main CI to pass before retrying." >&2
            exit 1
          fi

      - name: Configure pinned pnpm for pre-tag quality
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure pinned Rust for pre-tag quality
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts for pre-tag quality
        if: steps.eligibility.outputs.eligible == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: true
          key: release-quality-pretag

      - name: Install frozen pnpm dependency graph
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify CHANGELOG entry before immutable tag
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: node scripts/release/verify-changelog.mjs

      - name: Install Chromium for pre-tag quality
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Run source-bound pre-tag release quality gate
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: node scripts/release/run-release-quality.mjs

      - name: Upload pre-tag release quality evidence
        if: always() && steps.eligibility.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scriptor-pretag-release-quality
          path: artifacts/release-quality/*
          if-no-files-found: warn
          retention-days: 14

  tag-and-dispatch:
    needs: validate-release
    if: needs.validate-release.outputs.eligible == 'true'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    concurrency:
      group: release-kickoff-publish
      # Once validation has completed, never cancel the tag-and-dispatch side
      # effects midway through an immutable tag publication.
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create immutable version tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          existing_commit=$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')
          if [ -z "$existing_commit" ]; then
            existing_commit=$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')
          fi
          if [ -n "$existing_commit" ] && [ "$existing_commit" != "$GITHUB_SHA" ]; then
            echo "Tag $tag already points to $existing_commit; refusing to move or reuse it." >&2
            exit 1
          fi
          if [ -z "$existing_commit" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Scriptor $tag"
            git push origin "refs/tags/$tag"
          else
            echo "Tag $tag already points to this release commit; re-dispatching publication."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch production workflow on immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run release.yml
          --ref "${{ steps.tag.outputs.tag }}"
          -f publish=true
