name: Release Binary Review

# Binary review is an explicit candidate-review operation, not another PR CI
# owner. Main CI validates source on every ready PR; operators dispatch this
# workflow only for a frozen candidate that needs non-publishing binary evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review CLI and daemon release binaries
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
          key: release-review

      - name: Run release-specific contracts
        shell: pwsh
        run: |
          node scripts/release/version.mjs check
          node --test scripts/release/source-identity.test.mjs scripts/release/release-evidence-utils.test.mjs scripts/release/sbom-utils.test.mjs scripts/release/signing-policy.test.mjs
          node --test scripts/validation/release-hardening-contracts.test.mjs
          node --test scripts/packaging/zip-lite.test.mjs

      - name: Build release binaries
        shell: pwsh
        run: cargo build --locked --release -p scriptor-cli -p scriptor-daemon --jobs 2

      - name: Create binary review manifest
        shell: pwsh
        run: ./scripts/release/review-binaries.ps1

      - name: Upload review manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-review-binaries-${{ github.run_attempt }}
          path: dist/release-review/binary-review.json
          if-no-files-found: error
