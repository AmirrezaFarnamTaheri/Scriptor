name: Publish Vault

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH to deploy the reviewed vault artifact
        required: true
        type: string

concurrency:
  group: publish-vault-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  FORCE_COLOR: 1

jobs:
  export-and-deploy:
    name: Export vault and package Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_LOG_DIR: artifacts/ci-logs/publish-vault-export
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22 with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true

      - name: Describe vault publication scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Vault export and Pages artifact packaging"

      - name: Install frozen pnpm dependency graph
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install frozen pnpm dependency graph" -FilePath "pnpm" -ArgumentList @("install", "--frozen-lockfile") -TimeoutSeconds 900

      - name: Build release daemon used by static exporter
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Build release daemon used by static exporter" -FilePath "cargo" -ArgumentList @("build", "-p", "scriptor-daemon", "--release") -TimeoutSeconds 1800 -HeartbeatSeconds 20

      - name: Export minimal vault to strict static site
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Export minimal vault to strict static site" -FilePath "node" -ArgumentList @("scripts/ci/export-vault.mjs", "--vault", "packages/test-fixtures/vaults/minimal", "--profile", "blog", "--output", "./dist", "--ci", "--fail-on-warnings", "--daemon", "./target/release/scriptor-daemon") -TimeoutSeconds 1200

      - name: Inventory exported static site
        shell: pwsh
        run: |
          $inventoryPath = Join-Path $env:CI_LOG_DIR "site-inventory.log"
          $lines = @()
          foreach ($item in @(Get-ChildItem -LiteralPath dist -Recurse -File | Sort-Object FullName)) {
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "file=$($item.FullName) bytes=$($item.Length) sha256=$hash"
            $lines += $line
            Write-Host $line
          }
          if ($lines.Count -eq 0) { throw "Static export produced no files under dist/." }
          $totalBytes = (Get-ChildItem -LiteralPath dist -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $lines += "file_count=$($lines.Count)"
          $lines += "total_bytes=$totalBytes"
          $lines | Set-Content -LiteralPath $inventoryPath -Encoding utf8
          "| Inventory exported static site | PASS | - | 0 | ``site-inventory.log`` |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Capture vault export failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Vault export and Pages artifact packaging"

      - name: Finalize vault export evidence
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "Vault export and Pages artifact packaging" -Status $env:JOB_STATUS

      - name: Upload vault export evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-publish-vault-export-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy vault artifact to GitHub Pages
    needs: export-and-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: inputs.confirmation == 'PUBLISH'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI_LOG_DIR: artifacts/ci-logs/publish-vault-deploy
    steps:
      - name: Checkout deployment metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Describe Pages deployment scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "GitHub Pages deployment"

      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Record deployed Pages URL
        shell: pwsh
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PAGE_URL)) { throw "deploy-pages returned an empty page_url output." }
          @(
            "page_url=$env:PAGE_URL",
            "deployed_utc=$([DateTimeOffset]::UtcNow.ToString('o'))",
            "sha=$env:GITHUB_SHA",
            "run_id=$env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath "$env:CI_LOG_DIR/deployment.log" -Encoding utf8
          Write-Host "Deployed Pages URL: $env:PAGE_URL"
          @(
            "",
            "### Deployment result",
            "",
            "- URL: $env:PAGE_URL",
            "- Commit: ``$env:GITHUB_SHA``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Capture Pages deployment failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "GitHub Pages deployment"

      - name: Finalize Pages deployment evidence
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "GitHub Pages deployment" -Status $env:JOB_STATUS

      - name: Upload Pages deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-publish-vault-deploy-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14
