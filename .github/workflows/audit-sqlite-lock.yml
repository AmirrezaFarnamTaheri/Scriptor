name: Audit SQLite lock preparation

on:
  push:
    branches: [fix/audit-workflow-ux-2026-11-09]
    paths:
      - 'crates/indexer/Cargo.toml'
      - 'crates/embeddings/Cargo.toml'
      - 'crates/indexer/src/db.rs'
      - '.github/workflows/audit-sqlite-lock.yml'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve patched SQLite dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compatible lockfile without modifying remote repository
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo update -p rusqlite --precise 0.41.1
          cargo update -p libsqlite3-sys --precise 0.39.1
          python3 - <<'PY'
          import pathlib, tomllib
          packages = tomllib.loads(pathlib.Path("Cargo.lock").read_text())["package"]
          names = {p["name"]: p["version"] for p in packages if p["name"] in ("rusqlite", "libsqlite3-sys", "r2d2_sqlite")}
          assert names.get("rusqlite") == "0.41.1", names
          assert names.get("libsqlite3-sys") == "0.39.1", names
          assert "r2d2_sqlite" not in names, names
          print("Resolved:", names)
          PY
          mkdir -p artifacts/audit-sqlite-lock
          cp Cargo.lock artifacts/audit-sqlite-lock/Cargo.lock
          git diff -- Cargo.lock > artifacts/audit-sqlite-lock/changes.patch

      - name: Validate source and SQLite pool
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p scriptor-indexer --lib --locked
          cargo check -p scriptor-embeddings --locked

      - name: Upload exact generated lockfile for PR review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-sqlite-lock-${{ github.sha }}
          path: artifacts/audit-sqlite-lock/
          if-no-files-found: warn
          retention-days: 3
