name: Apply verified vault remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-verified-vault-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply remediation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: 5abf2d818114254969a7199708589a1368d8329a
          PATCH_GZIP_SHA256: 6816e180bb2092330a616b57b3299db78217d062ff75d45f9832d0d6988fd023
          PATCH_SHA256: 520d4df9dc0a8bf6898d788b2f6f7391f92e1260cb2c7aea818648b05e1ccc25
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            > /tmp/vault-remediation-blob.json

          jq -er '.content' /tmp/vault-remediation-blob.json \
            | tr -d '\r\n' > /tmp/vault-remediation-api.b64
          base64 --decode /tmp/vault-remediation-api.b64 \
            > /tmp/vault-remediation-candidate-1

          candidates=(/tmp/vault-remediation-candidate-1)
          tr -d '\r\n' < /tmp/vault-remediation-candidate-1 \
            > /tmp/vault-remediation-candidate-1.compact
          if base64 --decode /tmp/vault-remediation-candidate-1.compact \
              > /tmp/vault-remediation-candidate-2 2>/dev/null; then
            candidates+=(/tmp/vault-remediation-candidate-2)
          else
            rm -f /tmp/vault-remediation-candidate-2
          fi

          patch_found=false
          for candidate in "${candidates[@]}"; do
            candidate_sha="$(sha256sum "$candidate" | awk '{print $1}')"
            candidate_type="$(file -b "$candidate" || true)"
            echo "candidate=$(basename "$candidate") sha256=${candidate_sha} type=${candidate_type}"

            if [[ "$candidate_sha" == "$PATCH_SHA256" ]]; then
              cp "$candidate" /tmp/vault-remediation.patch
              patch_found=true
              break
            fi

            if [[ "$candidate_sha" == "$PATCH_GZIP_SHA256" ]]; then
              gzip --test "$candidate"
              gzip --decompress --stdout "$candidate" \
                > /tmp/vault-remediation.patch
              patch_found=true
              break
            fi

            if gzip --test "$candidate" 2>/dev/null; then
              gzip --decompress --stdout "$candidate" \
                > /tmp/vault-remediation-expanded.patch
              expanded_sha="$(sha256sum /tmp/vault-remediation-expanded.patch | awk '{print $1}')"
              echo "expanded=$(basename "$candidate") sha256=${expanded_sha}"
              if [[ "$expanded_sha" == "$PATCH_SHA256" ]]; then
                mv /tmp/vault-remediation-expanded.patch \
                  /tmp/vault-remediation.patch
                patch_found=true
                break
              fi
            fi
          done

          if [[ "$patch_found" != true ]]; then
            echo 'No decoded payload matched the pinned compressed or patch SHA-256.' >&2
            exit 1
          fi

          echo "${PATCH_SHA256}  /tmp/vault-remediation.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/vault-remediation.patch

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --3way /tmp/vault-remediation.patch
          git rm -f \
            .github/workflows/apply-vault-slice.yml \
            .github/workflows/apply-vault-slice-pr.yml
          git commit --amend --no-edit
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
