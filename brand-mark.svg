<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep graphite to rich dark slate-teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#072a2e" />
    </linearGradient>
    
    <!-- Outer Luminous Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#0d9488" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#0f766e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Keycap side-wall gradient (3D depth) -->
    <linearGradient id="tileBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#032f30" />
    </linearGradient>
    
    <!-- Keycap top face gradient (Illuminated surface) -->
    <linearGradient id="tileTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    
    <!-- Diagonal reflection sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    
    <!-- Specular highlight rim -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Pattern for structured dot grid -->
    <pattern id="dotGrid" x="16" y="16" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2dd4bf" opacity="0.18" />
    </pattern>

    <!-- Deep multi-layered drop shadow for tiles -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#01050f" flood-opacity="0.75" />
    </filter>

    <!-- Glowing effect filter for active items -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- 2. Dot Grid Overlay -->
  <rect width="512" height="512" fill="url(#dotGrid)" />
  
  <!-- 3. Luminous Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- 4. Keycaps / Tiles -->
  <g>
    <!-- Tile 1: Upper-Right vertical bar (behind) -->
    <g>
      <rect x="288" y="160" width="64" height="96" rx="16" fill="url(#tileBaseGrad)" filter="url(#shadow)" />
      <rect x="292" y="163" width="56" height="86" rx="12" fill="url(#tileTopGrad)" />
      <rect x="289" y="161" width="62" height="94" rx="15" fill="none" stroke="url(#highlightGrad)" stroke-width="1.2" />
    </g>

    <!-- Tile 2: Lower-Left vertical bar (behind) -->
    <g>
      <rect x="160" y="256" width="64" height="96" rx="16" fill="url(#tileBaseGrad)" filter="url(#shadow)" />
      <rect x="164" y="259" width="56" height="86" rx="12" fill="url(#tileTopGrad)" />
      <rect x="161" y="257" width="62" height="94" rx="15" fill="none" stroke="url(#highlightGrad)" stroke-width="1.2" />
    </g>

    <!-- Tile 3: Top horizontal bar -->
    <g>
      <rect x="160" y="128" width="192" height="64" rx="16" fill="url(#tileBaseGrad)" filter="url(#shadow)" />
      <rect x="164" y="131" width="184" height="56" rx="12" fill="url(#tileTopGrad)" />
      <rect x="161" y="129" width="190" height="62" rx="15" fill="none" stroke="url(#highlightGrad)" stroke-width="1.2" />
      <!-- Glowing "<" glyph -->
      <path d="M 186 154 L 178 160 L 186 166" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" opacity="0.6" />
      <path d="M 186 154 L 178 160 L 186 166" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Tile 4: Middle horizontal bar -->
    <g>
      <rect x="160" y="224" width="192" height="64" rx="16" fill="url(#tileBaseGrad)" filter="url(#shadow)" />
      <rect x="164" y="227" width="184" height="56" rx="12" fill="url(#tileTopGrad)" />
      <rect x="161" y="229" width="190" height="58" rx="15" fill="none" stroke="url(#highlightGrad)" stroke-width="1.2" />
      <!-- Glowing cursor "_" glyph -->
      <line x1="246" y1="255" x2="266" y2="255" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" filter="url(#glow)" opacity="0.6" />
      <line x1="246" y1="255" x2="266" y2="255" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Tile 5: Bottom horizontal bar -->
    <g>
      <rect x="160" y="320" width="192" height="64" rx="16" fill="url(#tileBaseGrad)" filter="url(#shadow)" />
      <rect x="164" y="323" width="184" height="56" rx="12" fill="url(#tileTopGrad)" />
      <rect x="161" y="321" width="190" height="62" rx="15" fill="none" stroke="url(#highlightGrad)" stroke-width="1.2" />
      <!-- Glowing ">" glyph -->
      <path d="M 326 346 L 334 352 L 326 358" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" opacity="0.6" />
      <path d="M 326 346 L 334 352 L 326 358" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- 5. Glassy reflection sheen overlay across S-Monogram -->
  <rect x="160" y="128" width="192" height="256" rx="16" fill="url(#sheenGrad)" pointer-events="none" />

  <!-- 6. Floating particle glints and stars -->
  <!-- Upper-Left Glint -->
  <path d="M 108 184 Q 108 192 116 192 Q 108 192 108 200 Q 108 192 100 192 Q 108 192 108 184 Z" fill="#2dd4bf" filter="url(#glow)" opacity="0.85" />
  <circle cx="108" cy="192" r="2.5" fill="#ffffff" />

  <!-- Lower-Right Glint -->
  <path d="M 404 312 Q 404 320 412 320 Q 404 320 404 328 Q 404 320 396 320 Q 404 320 404 312 Z" fill="#2dd4bf" filter="url(#glow)" opacity="0.9" />
  <circle cx="404" cy="320" r="3" fill="#ffffff" />

  <!-- Additional floating circular dust -->
  <circle cx="388" cy="116" r="3" fill="#ffffff" opacity="0.85" filter="url(#glow)" />
  <circle cx="120" cy="384" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="256" cy="74" r="2.5" fill="#2dd4bf" opacity="0.75" filter="url(#glow)" />
  <circle cx="256" cy="438" r="2.5" fill="#2dd4bf" opacity="0.75" filter="url(#glow)" />
</svg>
