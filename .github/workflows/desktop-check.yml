name: Desktop compile

on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ci/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ci/**"
      - ".github/workflows/desktop-check.yml"

permissions:
  contents: read

concurrency:
  group: desktop-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    name: Desktop crate compile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI_LOG_DIR: artifacts/ci-logs/desktop-${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned Rust 1.96.0
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
          key: ${{ matrix.platform }}

      - name: Describe desktop compile scope
        shell: pwsh
        run: ./scripts/ci/collect-diagnostics.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})"

      - name: Install Linux desktop system dependencies
        if: matrix.platform == 'linux'
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Install Linux desktop system dependencies" -FilePath "bash" -ArgumentList @("-lc", "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf") -TimeoutSeconds 900

      - name: Compile desktop crate, tests, examples, and build scripts
        shell: pwsh
        run: |
          # Temporary diagnostics wrapper: run cargo check and, on failure, re-emit
          # only the compiler error diagnostics at the very end of this step's
          # output so the GitHub failure annotation (which shows trailing lines)
          # surfaces the real errors instead of just the summary line.
          $ErrorActionPreference = 'Continue'
          $env:CARGO_TERM_COLOR = 'never'
          $logDir = $env:CI_LOG_DIR
          if ([string]::IsNullOrWhiteSpace($logDir)) { $logDir = 'artifacts/ci-logs/desktop-check' }
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $log = Join-Path $logDir 'compile-errors.txt'
          $out = & cargo check -p scriptor-desktop --all-targets --locked 2>&1
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = @($out)
            Write-Host ''
            Write-Host '===== COMPILER DIAGNOSTICS ====='
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(error(\[|:)|warning:|  --> )') {
                $start = [Math]::Max(0, $i - 1)
                $end = [Math]::Min($lines.Count - 1, $i + 6)
                for ($j = $start; $j -le $end; $j++) { Write-Host $lines[$j] }
                Write-Host '-----'
                $i = $end
              }
            }
          }
          $out | Set-Content -LiteralPath $log -Encoding utf8
          exit $code

      - name: Run resource filesystem regression tests
        if: matrix.platform == 'linux'
        shell: pwsh
        run: ./scripts/ci/invoke-logged.ps1 -Name "Run resource filesystem regression tests" -FilePath "cargo" -ArgumentList @("test", "-p", "scriptor-desktop", "--lib", "--locked", "commands::resources::fs_ops::tests::") -TimeoutSeconds 900 -HeartbeatSeconds 20

      - name: Capture desktop compile failure context
        if: failure()
        shell: pwsh
        run: ./scripts/ci/collect-failure-context.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})"

      - name: Finalize desktop compile evidence
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/ci/finalize-job.ps1 -Scope "Desktop crate compile (${{ matrix.platform }})" -Status $env:JOB_STATUS

      - name: Upload desktop compile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-desktop-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7
