[package]
name = "scriptor-publish-runner"
version = "1.0.0"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
scriptor-vault = { path = "../vault" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
