[package]
name = "scriptor-canvas-engine"
version = "1.0.5"
edition = "2024"
license.workspace = true

[dependencies]
scriptor-vault = { path = "../vault" }
scriptor-export-runner = { path = "../export-runner" }
scriptor-system-bridge = { path = "../system-bridge" }
chrono = { version = "0.4", features = ["serde"] }
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny-skia = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"
