[package]
name = "scriptor-capture"
version = "1.0.1"
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
scriptor-vault = { path = "../vault" }

# HTML parsing and sanitisation (pure Rust, no subprocess)
scraper     = "0.27"          # CSS-selector HTML parser (wraps html5ever)
ammonia     = "4"             # Allow-list HTML sanitiser (strips scripts/handlers/srcdoc)
htmd        = "0.5"           # HTML → Markdown converter

# HTTP client — feature-gated async; capture always runs in a blocking context
# via `tokio::task::spawn_blocking` so we use the blocking API.
ureq        = { version = "3", features = ["charset", "gzip"] }

# Error handling
thiserror   = "2"

# Serialisation (for the capture output type)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Tracing
tracing     = "0.1"

[dev-dependencies]
tempfile    = "3"
