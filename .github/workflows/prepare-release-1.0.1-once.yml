name: Prepare release 1.0.1 version manifests

on:
  push:

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/release-linux-xdg-utils-v1.0.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-linux-xdg-utils-v1.0.1
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Synchronize and commit non-workflow version files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(tr -d '[:space:]' < VERSION)" = "1.0.1" ]; then
            node scripts/release/version.mjs check
            grep -F 'patchelf xdg-utils' .github/workflows/release.yml >/dev/null
            echo 'v1.0.1 manifests already synchronized.'
            exit 0
          fi

          printf '1.0.1\n' > VERSION
          node scripts/release/version.mjs sync
          cargo metadata --format-version=1 >/dev/null
          node scripts/release/version.mjs check
          grep -F 'patchelf xdg-utils' .github/workflows/release.yml >/dev/null
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t changed < <(git diff --name-only | grep -v '^\.github/workflows/')
          test "${#changed[@]}" -gt 0
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m 'chore(release): synchronize v1.0.1 manifests'
          git push origin HEAD:refs/heads/fix/release-linux-xdg-utils-v1.0.1
