name: Refresh visual baselines once

on:
  push:
    branches:
      - integrate/open-prs-v0.1.1
    paths:
      - .github/workflows/refresh-visual-baselines.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh five stale Windows visual baselines
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integrate/open-prs-v0.1.1

      - name: Configure pinned pnpm 10.33.0
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Configure Node.js 22 with pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependency graph
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install Playwright FFmpeg runtime
        shell: pwsh
        run: pnpm exec playwright install ffmpeg

      - name: Refresh only stale visual baselines
        shell: pwsh
        run: >-
          pnpm exec playwright test
          --config playwright.visual.config.ts
          --update-snapshots=all
          --grep "main workspace.*dark mode|git panel|publish center|conflict resolver modal|mobile viewport"

      - name: Verify and commit exact baseline refresh
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- docs/assets/screenshots e2e/screenshots.spec.ts-snapshots
          git rm .github/workflows/refresh-visual-baselines.yml

          $expected = @(
            '.github/workflows/refresh-visual-baselines.yml',
            'docs/assets/screenshots/conflict-resolver.png',
            'docs/assets/screenshots/git-panel.png',
            'docs/assets/screenshots/publish-center.png',
            'docs/assets/screenshots/workspace-dark.png',
            'docs/assets/screenshots/workspace-mobile.png',
            'e2e/screenshots.spec.ts-snapshots/conflict-resolver-win32.png',
            'e2e/screenshots.spec.ts-snapshots/git-panel-win32.png',
            'e2e/screenshots.spec.ts-snapshots/publish-center-win32.png',
            'e2e/screenshots.spec.ts-snapshots/workspace-dark-win32.png',
            'e2e/screenshots.spec.ts-snapshots/workspace-mobile-win32.png'
          ) | Sort-Object
          $changed = @(git diff --cached --name-only) | Sort-Object
          $delta = @(Compare-Object -ReferenceObject $expected -DifferenceObject $changed)
          if ($delta.Count -ne 0) {
            Write-Host 'Unexpected baseline change set:'
            $delta | Format-Table | Out-String | Write-Host
            git status --short
            throw 'Refusing to commit anything outside the five verified stale baselines.'
          }

          git diff --cached --check
          git commit -m "test(visual): refresh consolidated UI baselines"
          git push origin HEAD:integrate/open-prs-v0.1.1
